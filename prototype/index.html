<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>独角数卡 · 自动代练（本地原型）</title>
<style>
:root {
  color-scheme: light;
  --ink: #1d2a36;
  --ink-2: #4a5866;
  --ink-3: #7b8794;
  --paper: #eef1f4;
  --panel: #ffffff;
  --line: #d5dbe2;
  --line-2: #e7ebef;
  --jade: #1f7a6b;
  --jade-soft: #e3f1ee;
  --amber: #a8691a;
  --amber-soft: #fbf0df;
  --red: #b23a3a;
  --red-soft: #f8e6e6;
  --blue: #2c5d8f;
  --blue-soft: #e4edf6;
  --violet: #6a4c93;
  --violet-soft: #efe9f6;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --mono: "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.6 var(--sans);
  color: var(--ink);
  background: var(--paper);
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 22px; line-height: 1.3; }
h3 { font-size: 16px; line-height: 1.4; }
a { color: var(--blue); }

/* ---------- 顶栏 ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
  padding: 10px 20px; background: var(--ink); color: #e9eef3; white-space: nowrap;
}
.top .roles { margin-right: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--serif); font-size: 18px; letter-spacing: 0.04em; }
.brand span { font-size: 12px; color: #9fb0bf; }
.roles { display: flex; gap: 2px; background: #2a3a49; border-radius: 8px; padding: 3px; justify-self: start; }
.roles button {
  border: 0; background: transparent; color: #b9c6d2; padding: 5px 14px; border-radius: 6px; cursor: pointer;
}
.roles button[aria-pressed="true"] { background: #f6f7f9; color: var(--ink); font-weight: 600; }
.clock { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock time { font-size: 15px; font-weight: 600; color: #fff; min-width: 132px; text-align: right; }
.clock .ff { display: flex; gap: 2px; }
.clock .ff button {
  border: 1px solid #3c4f61; background: transparent; color: #c9d5e0; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
.clock .ff button:hover { background: #2f4152; color: #fff; }
.clock .reset { border-color: #6a4040 !important; color: #e6b8b8 !important; }

/* ---------- 布局 ---------- */
.shell { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - var(--top-h, 52px)); }
.shell.nolog { grid-template-columns: 1fr 0; }
.content { padding: 20px 24px 60px; overflow: auto; height: calc(100vh - var(--top-h, 52px)); }
.log {
  border-left: 1px solid var(--line); background: #f7f9fa; height: calc(100vh - var(--top-h, 52px)); overflow: auto;
  padding: 14px 14px 40px; font-size: 12.5px;
}
.log h3 { font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.log ol { list-style: none; margin: 0; padding: 0; }
.log li { padding: 6px 0 6px 12px; border-bottom: 1px solid var(--line-2); position: relative; color: var(--ink-2); }
.log li::before { content: ""; position: absolute; left: 0; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.log li time { display: block; color: var(--ink-3); font-size: 11px; }
.log li.k-order::before { background: var(--blue); }
.log li.k-payment::before, .log li.k-deliver::before { background: var(--jade); }
.log li.k-points::before { background: var(--amber); }
.log li.k-task::before, .log li.k-bind::before { background: var(--violet); }
.log li.k-alert { color: var(--red); }
.log li.k-alert::before { background: var(--red); }
.log li.k-worker::before { background: #8a96a3; }

.subnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 18px; }
.subnav button {
  border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.subnav button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.subnav .grow { flex: 1; }

.who { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.who select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.who .stat { display: flex; align-items: baseline; gap: 6px; }
.who .stat small { color: var(--ink-3); }
.money { font-weight: 600; }
.pts { color: var(--amber); font-weight: 600; }
.pts::after { content: " 点"; font-weight: 400; font-size: 0.85em; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.panel + .panel { margin-top: 16px; }
.cols > .panel + .panel { margin-top: 0; }
.panel h3 { margin-bottom: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel-head h3 { margin: 0; }
.cols { display: grid; gap: 16px; }
.cols.c2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cols.c-side { grid-template-columns: 240px minmax(0, 1fr); align-items: start; }
.cols.c-task { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }

/* ---------- 表单 ---------- */
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field > span { font-size: 12.5px; color: var(--ink-2); }
.field input, .field select, .field textarea, input.inline, select.inline {
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; background: #fff; width: 100%;
}
input.inline, select.inline { width: auto; padding: 3px 7px; }
.field textarea { font-family: var(--mono); font-size: 12px; min-height: 140px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

.btn {
  border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: #b8c2cc; background: #f8fafb; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: #fff; }
.btn.primary:hover { background: #196759; }
.btn.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
.btn.danger { color: var(--red); border-color: #e2c3c3; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); padding: 2px 6px; }
.btn.sm { padding: 2px 8px; font-size: 12.5px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- 状态 ---------- */
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; line-height: 20px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--jade-soft); color: var(--jade); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.err { background: var(--red-soft); color: var(--red); }
.pill.info { background: var(--blue-soft); color: var(--blue); }
.pill.run { background: var(--violet-soft); color: var(--violet); }

/* ---------- 账号市场 ---------- */
.filters .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-bottom: 12px; }
.filters .seg button { flex: 1; border: 0; background: #fff; padding: 6px 0; cursor: pointer; }
.filters .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.filters .range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; text-align: left;
  display: grid; gap: 8px; align-content: start; position: relative;
}
.card:hover { border-color: var(--ink-3); }
.card .tag { position: absolute; top: 0; left: 14px; width: 28px; height: 4px; border-radius: 0 0 3px 3px; }
.card h4 { margin: 4px 0 0; font-size: 15px; font-family: var(--serif); line-height: 1.4; }
.card .attrs { display: flex; flex-wrap: wrap; gap: 4px; }
.card .attrs span { font-size: 12px; background: var(--paper); border-radius: 4px; padding: 0 6px; color: var(--ink-2); }
.card .price { font-size: 20px; font-weight: 700; }
.card .meta { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; }
.empty { padding: 40px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 10px; }

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-size: 12.5px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; }
tr.dim td { color: var(--ink-3); }
.tiers { display: flex; gap: 6px; flex-wrap: wrap; }
.tiers span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.tiers span.hit { border-color: var(--jade); color: var(--jade); background: var(--jade-soft); }

/* ---------- 积分 ---------- */
.balance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.balance > div { background: #fff; padding: 14px 18px; }
.balance b { display: block; font-size: 28px; line-height: 1.2; font-family: var(--serif); }
.balance b.pts::after { font-size: 14px; }
.balance small { color: var(--ink-3); }
.packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pack { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; background: linear-gradient(#fff, #fff) padding-box; }
.pack .big { font-family: var(--serif); font-size: 26px; color: var(--amber); }
.pack .bonus { color: var(--amber); font-size: 12.5px; min-height: 20px; }

/* ---------- 代练 ---------- */
.binding { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.binding + .binding { margin-top: 8px; }
.binding .msg { font-size: 12.5px; color: var(--ink-2); }
.features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.feature { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.feature input { position: absolute; opacity: 0; pointer-events: none; }
.feature:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.feature .cost { color: var(--amber); font-size: 12.5px; }
.feature .desc { font-size: 12px; color: var(--ink-3); }
.quote { background: var(--amber-soft); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; }
.quote.bad { background: var(--red-soft); color: var(--red); }
.task { border-bottom: 1px solid var(--line-2); padding: 10px 0; display: grid; gap: 6px; }
.task .bar { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.task .bar i { display: block; height: 100%; background: var(--violet); transition: width 0.3s ease; }
.task.SUCCESS .bar i { background: var(--jade); }
.task.FAIL .bar i { background: var(--red); }
.task.CANCELLED .bar i { background: var(--ink-3); }
.task .ledger { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; }
.events { background: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-height: 180px; overflow: auto; }
.events div { display: grid; grid-template-columns: 34px 52px 1fr; gap: 6px; }
.need { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }

/* ---------- Worker ---------- */
.workers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.worker { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.worker .caps { font-size: 12px; color: var(--ink-2); }
.worker code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.lease { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff; display: grid; gap: 8px; }
.lease + .lease { margin-top: 10px; }
.lease.cancel { border-color: var(--red); }
.http { background: #17222c; color: #d7e1ea; border-radius: 10px; padding: 12px 14px; font: 12px/1.55 var(--mono); overflow: auto; max-height: 520px; white-space: pre-wrap; word-break: break-all; }
.http .s2 { color: #8fd3b9; }
.http .s4 { color: #f0a1a1; }
.http .k { color: #8fb6d9; }

/* ---------- 后台 ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi h4 { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.kpi ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.kpi li { display: flex; justify-content: space-between; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line-2); }
.checks li b { color: var(--jade); }
.checks li.bad b, .checks li.bad { color: var(--red); }
.pager { display: flex; gap: 6px; justify-content: flex-end; align-items: center; margin-top: 10px; font-size: 12.5px; }
.cred { font-family: var(--mono); font-size: 12.5px; background: var(--paper); border-radius: 4px; padding: 1px 6px; user-select: all; }

/* ---------- 浮层 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(29, 42, 54, 0.42); z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal { background: #fff; border-radius: 12px; width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 20px 22px; box-shadow: 0 18px 50px rgba(20, 30, 40, 0.28); }
.modal.wide { width: min(860px, 100%); }
.modal h2 { margin-bottom: 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.drawer { position: fixed; top: var(--top-h, 52px); right: 0; bottom: 0; width: min(440px, 100%); background: #fff; border-left: 1px solid var(--line); z-index: 40; overflow: auto; padding: 20px 22px; box-shadow: -12px 0 30px rgba(20, 30, 40, 0.12); }
.drawer .close { float: right; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13.5px; margin: 12px 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.priceline { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13.5px; padding: 10px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); margin: 12px 0; }
.priceline .total { font-size: 22px; font-weight: 700; font-family: var(--serif); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 8px; background: var(--ink); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 80vw; }
.toast.err { background: var(--red); }
.toast.ok { background: var(--jade); }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--blue-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }

@media (max-width: 1200px) {
  .shell { grid-template-columns: 1fr; }
  .log { display: none; }
  .workers, .kpis { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .task .bar i { transition: none; } }

/* ================= 代练：游戏切换、功能列表、下单 ================= */
.game-strip { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.game-strip button {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-weight: 600;
}
.game-strip button small { font-weight: 400; color: var(--ink-3); }
.game-strip button[aria-selected="true"] { border-color: var(--gc, var(--ink)); box-shadow: inset 0 0 0 1px var(--gc, var(--ink)); }
.gdot { width: 10px; height: 10px; border-radius: 50%; background: var(--gc, var(--ink-3)); flex: none; }
.boost-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.feature-list { position: sticky; top: 0; display: grid; gap: 6px; }
.feature-list h3 { font-size: 14px; color: var(--ink-2); margin: 0 0 2px; }
.feat { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 9px 12px; cursor: pointer; display: grid; gap: 1px; }
.feat span { font-size: 12px; color: var(--amber); }
.feat.on { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.boost-main { padding: 18px 20px 22px; }
.fo-head h2 { margin-bottom: 2px; }
.fo-head p { margin: 0 0 12px; }
.fo-account { padding: 10px 0 14px; border-bottom: 1px solid var(--line-2); margin-bottom: 16px; display: grid; gap: 6px; }
.acct-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip small { color: var(--ink-3); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.on small { color: #c3ccd5; }
.chip.add { border-style: dashed; color: var(--blue); }
.fo-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
.fo-side { position: sticky; top: 0; display: grid; gap: 10px; }
.btn.block { width: 100%; padding: 9px 12px; font-size: 15px; }

/* ================= 自动生成的表单 ================= */
.ff { border: 0; margin: 0 0 16px; padding: 0; min-width: 0; }
.ff legend, .ff-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; padding: 0; }
.ff .req { color: var(--red); font-style: normal; }
.ff-help { font-size: 12.5px; color: var(--ink-3); margin: 4px 0 0; }
.ff-err { font-size: 12.5px; color: var(--red); margin: 4px 0 0; }
.ff.has-err .stage-picker, .ff.has-err > select, .ff.has-err > input { border-color: var(--red); }
.ff > select, .ff > input[type="text"] { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; background: #fff; width: 100%; max-width: 420px; }
.seg-opts, .chk-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; background: #fff; }
.opt input { margin: 0; }
.opt.on { border-color: var(--ink); background: #f4f6f8; }
.addon { color: var(--amber); font-size: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background 0.15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + .track { background: var(--jade); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--blue); outline-offset: 2px; }
.num-row { display: flex; align-items: center; gap: 6px; }
.num-row input { width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; text-align: center; }

/* 关卡选择器 */
.stage-picker { border: 1px solid var(--line); border-radius: 10px; background: #fbfcfc; overflow: hidden; }
.sp-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: #fff; flex-wrap: wrap; }
.sp-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.sp-tabs button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.sp-tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
.sp-tabs button b { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--amber); color: #fff; font-size: 11px; line-height: 16px; text-align: center; }
.sp-search { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 150px; }
.sp-group { margin: 10px 12px 0; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; padding: 10px; }
.sp-item { border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.sp-item.on { border-color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade); }
.sp-item.off { opacity: 0.55; }
.sp-item.on.off { opacity: 1; border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.sp-main { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "chk name cost" "chk meta cost"; gap: 2px 8px; padding: 8px 10px; cursor: pointer; align-items: center; }
.sp-main input { grid-area: chk; }
.sp-name { grid-area: name; }
.sp-meta { grid-area: meta; }
.sp-cost { grid-area: cost; }
.sp-item.off .sp-main { cursor: not-allowed; }
.sp-main input { margin: 0; }
.sp-name { font-weight: 600; font-size: 13.5px; }
.sp-cost { font-size: 12.5px; color: var(--amber); white-space: nowrap; text-align: right; }
.sp-meta { display: flex; gap: 4px; flex-wrap: wrap; min-height: 0; }
.tag-s { font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 3px; background: var(--paper); color: var(--ink-2); }
.sp-count { display: flex; align-items: center; gap: 4px; padding: 0 10px 8px 30px; }
.sp-count input { width: 56px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; text-align: center; }
.sp-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line-2); background: #fff; font-size: 12.5px; }

/* 报价单 */
.quote-box { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.qb-lines { padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; max-height: 260px; overflow: auto; }
.qb-lines > div { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; }
.qb-lines > div b { text-align: right; font-weight: 600; }
.qb-total { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--amber-soft); }
.qb-total b { font-size: 24px; font-family: var(--serif); }
.qb-avail { padding: 6px 12px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line-2); }
.qb-avail.bad { color: var(--red); background: var(--red-soft); }
.quote-box.bad .qb-total { background: var(--red-soft); }
.quote-box .ff-err { padding: 0 12px 8px; }

/* 任务步骤 */
table.steps td, table.steps th { padding: 4px 6px; font-size: 12.5px; }
table.steps tr.done td { color: var(--jade); }
table.steps tr.doing td { color: var(--violet); font-weight: 600; }

/* ================= 后台：游戏与功能编辑 ================= */
.admin-games { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.ag-list { position: sticky; top: 0; display: grid; gap: 6px; }
.ag-item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.ag-item small { display: block; color: var(--ink-3); font-size: 11.5px; }
.ag-item.on { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
h4.sub { margin: 4px 0 6px; font-size: 13px; color: var(--ink-2); }
tr.sel td { background: var(--blue-soft); }
.nowrap { white-space: nowrap; }
.pill.dim { opacity: 0.5; }
.editor { border-color: var(--blue); }
.editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
textarea.json { width: 100%; min-height: 560px; font: 12.5px/1.55 var(--mono); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fbfcfd; tab-size: 2; resize: vertical; }
.v-result { margin-top: 8px; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.v-result.ok { background: var(--jade-soft); color: var(--jade); }
.v-result.bad { background: var(--red-soft); color: var(--red); }
.v-result code { background: rgba(255,255,255,.6); padding: 0 4px; border-radius: 3px; }
.preview { position: sticky; top: 0; }
.preview-frame { border: 1px dashed var(--ink-3); border-radius: 10px; padding: 14px 16px; background: #fff; max-height: 760px; overflow: auto; }
.json-mini { font: 11.5px/1.5 var(--mono); background: var(--paper); padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
.schema-help { background: #f7f9fb; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.schema-help td { padding: 3px 6px; vertical-align: top; }
.schema-help code { font-size: 12px; }

@media (max-width: 1100px) {
  .boost-layout, .admin-games, .editor-grid, .fo-grid { grid-template-columns: 1fr; }
  .feature-list, .ag-list, .fo-side, .preview { position: static; }
  .feature-list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .feature-list h3 { grid-column: 1 / -1; }
}
.panel { min-width: 0; }
.panel table { word-break: break-word; }
td.row { flex-wrap: wrap; }
td input.inline, td select.inline { width: 100%; min-width: 64px; max-width: 220px; }
.panel-head { flex-wrap: wrap; }

<script>/* crypto.js */
/* 纯 JS 的 SHA-256 / HMAC-SHA256 与凭据"加密"模拟。
 * 浏览器和 Node 通用，同步执行，便于在原型里真实校验 Worker 签名。
 * 注意：sealCredential 只是 base64 封装，用于演示"凭据单独存储、按需解密"的流程，
 * 正式实现必须使用 internal/crypto 的 AES-256-GCM。 */
(function (root) {
  'use strict';

  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ]);

  function utf8(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    return Uint8Array.from(Buffer.from(str, 'utf8'));
  }

  function sha256Bytes(bytes) {
    const len = bytes.length;
    const bitLenHi = Math.floor((len * 8) / 0x100000000);
    const bitLenLo = (len * 8) >>> 0;
    const padded = new Uint8Array(((len + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[len] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, bitLenHi);
    dv.setUint32(padded.length - 4, bitLenLo);

    const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    const W = new Uint32Array(64);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
        const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
    }
    const out = new Uint8Array(32);
    const odv = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
    return out;
  }

  const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

  function sha256Hex(str) {
    return hex(sha256Bytes(utf8(str)));
  }

  function hmacSha256Hex(key, message) {
    let k = utf8(key);
    if (k.length > 64) k = sha256Bytes(k);
    const block = new Uint8Array(64);
    block.set(k);
    const ipad = new Uint8Array(64);
    const opad = new Uint8Array(64);
    for (let i = 0; i < 64; i++) {
      ipad[i] = block[i] ^ 0x36;
      opad[i] = block[i] ^ 0x5c;
    }
    const msg = utf8(message);
    const inner = new Uint8Array(64 + msg.length);
    inner.set(ipad);
    inner.set(msg, 64);
    const innerHash = sha256Bytes(inner);
    const outer = new Uint8Array(96);
    outer.set(opad);
    outer.set(innerHash, 64);
    return hex(sha256Bytes(outer));
  }

  // MD5（RFC 1321），仅用于和 internal/upstream/signer.go 保持同样的签名串格式 body_md5
  function md5Hex(str) {
    const bytes = utf8(str);
    const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
    const T = new Uint32Array(64);
    for (let i = 0; i < 64; i++) T[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 0x100000000) >>> 0;
    const len = bytes.length;
    const padded = new Uint8Array(((len + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[len] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, (len * 8) >>> 0, true);
    dv.setUint32(padded.length - 4, Math.floor((len * 8) / 0x100000000), true);
    let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    const M = new Uint32Array(16);
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) M[i] = dv.getUint32(off + i * 4, true);
      let A = a0, B = b0, Cc = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & Cc) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & Cc); g = (5 * i + 1) % 16; }
        else if (i < 48) { F = B ^ Cc ^ D; g = (3 * i + 5) % 16; }
        else { F = Cc ^ (B | ~D); g = (7 * i) % 16; }
        F = (F + A + T[i] + M[g]) >>> 0;
        A = D; D = Cc; Cc = B;
        const s = S[(i >> 4) * 4 + (i % 4)];
        B = (B + ((F << s) | (F >>> (32 - s)))) >>> 0;
      }
      a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + Cc) >>> 0; d0 = (d0 + D) >>> 0;
    }
    const out = new Uint8Array(16);
    const odv = new DataView(out.buffer);
    [a0, b0, c0, d0].forEach((v, i) => odv.setUint32(i * 4, v, true));
    return hex(out);
  }

  // 常量时间比较，避免签名比较的时序侧信道
  function safeEqual(a, b) {
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
  }

  function b64encode(str) {
    if (typeof Buffer !== 'undefined') return Buffer.from(str, 'utf8').toString('base64');
    return btoa(String.fromCharCode(...utf8(str)));
  }
  function b64decode(b64) {
    if (typeof Buffer !== 'undefined') return Buffer.from(b64, 'base64').toString('utf8');
    const bin = atob(b64);
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  }

  // 原型用的凭据封装：格式 "mock-gcm:{keyId}:{base64}"
  function sealCredential(keyId, obj) {
    return `mock-gcm:${keyId}:${b64encode(JSON.stringify(obj))}`;
  }
  function openCredential(cipher) {
    const parts = String(cipher).split(':');
    if (parts.length !== 3 || parts[0] !== 'mock-gcm') throw new Error('credential cipher invalid');
    return JSON.parse(b64decode(parts[2]));
  }

  const api = { sha256Hex, hmacSha256Hex, md5Hex, safeEqual, sealCredential, openCredential };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.GameCrypto = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* catalog.js */
/* 代练功能定义（Feature Definition）JSON 规范 —— 校验、编译、报价。
 *
 * 这是后台"用 JSON 配置代练功能、前端自动生成界面"的核心。
 * 同一份代码同时被三处使用，保证三者永远一致：
 *   1. 后台保存功能时：validateDefinition() 校验 JSON；
 *   2. 用户端渲染表单和实时报价：compile() 计算可见字段、默认值、错误、积分；
 *   3. 服务端创建任务：compile() 重新计算，前端传来的价格一律不用。
 * 完整格式说明见 docs/boost-feature-schema.md。
 */
(function (root) {
  'use strict';

  const SCHEMA_VERSION = 1;
  const CODE_RE = /^[a-z][a-z0-9_]{1,31}$/;
  const KEY_RE = /^[a-z][a-z0-9_]{0,31}$/;
  const ITEM_RE = /^[A-Za-z0-9][A-Za-z0-9_\-.]{0,31}$/;
  const FIELD_TYPES = ['radio', 'select', 'checkbox', 'switch', 'number', 'text', 'stage_picker'];
  const OPTION_TYPES = new Set(['radio', 'select', 'checkbox']);
  const REFUND_POLICIES = ['prorate', 'full_on_system_fail', 'none'];
  const TOP_KEYS = new Set(['schema_version', 'code', 'name', 'description', 'capability', 'timeout_minutes', 'max_active_per_user', 'refund_policy', 'member_discount', 'base_points', 'catalogs', 'fields', 'limits']);
  const FIELD_KEYS = new Set(['key', 'type', 'label', 'help', 'required', 'default', 'visible_when', 'options', 'min_select', 'max_select', 'points', 'min', 'max', 'unit', 'points_per', 'maxlength', 'pattern', 'placeholder', 'catalog', 'multiple', 'cost_by', 'count']);

  const isInt = (v) => Number.isInteger(v);
  const isObj = (v) => v != null && typeof v === 'object' && !Array.isArray(v);
  const str = (v) => typeof v === 'string';

  // ====================================================================
  // 1. 校验功能定义
  // ====================================================================
  function validateDefinition(def) {
    const errors = [];
    const warnings = [];
    const err = (path, msg) => errors.push({ path, msg });
    const warn = (path, msg) => warnings.push({ path, msg });

    if (!isObj(def)) {
      err('', '功能定义必须是一个 JSON 对象');
      return { ok: false, errors, warnings };
    }
    for (const k of Object.keys(def)) if (!TOP_KEYS.has(k)) warn(k, `未知字段「${k}」会被忽略`);

    if (def.schema_version !== undefined && def.schema_version !== SCHEMA_VERSION) err('schema_version', `只支持 schema_version = ${SCHEMA_VERSION}`);
    if (!str(def.code) || !CODE_RE.test(def.code)) err('code', 'code 必须是 2–32 位小写字母、数字或下划线，并以字母开头');
    if (!str(def.name) || !def.name.trim() || def.name.length > 40) err('name', 'name 必填，最多 40 个字');
    if (def.description !== undefined && (!str(def.description) || def.description.length > 300)) err('description', 'description 最多 300 个字');
    if (def.capability !== undefined && (!str(def.capability) || !CODE_RE.test(def.capability))) err('capability', 'capability 格式同 code');
    intRange(def, 'timeout_minutes', 5, 1440, false, err);
    intRange(def, 'max_active_per_user', 1, 20, false, err);
    intRange(def, 'base_points', 0, 100000, false, err);
    if (def.refund_policy !== undefined && !REFUND_POLICIES.includes(def.refund_policy)) err('refund_policy', `refund_policy 只能是 ${REFUND_POLICIES.join(' / ')}`);
    if (def.member_discount !== undefined && typeof def.member_discount !== 'boolean') err('member_discount', 'member_discount 必须是 true 或 false');
    if (def.limits !== undefined) {
      if (!isObj(def.limits)) err('limits', 'limits 必须是对象');
      else intRange(def.limits, 'max_units', 1, 10000, false, err, 'limits.');
    }

    // catalogs
    const catalogs = def.catalogs === undefined ? {} : def.catalogs;
    if (!isObj(catalogs)) err('catalogs', 'catalogs 必须是对象，键为目录名');
    else {
      for (const [ck, cat] of Object.entries(catalogs)) {
        const p = `catalogs.${ck}`;
        if (!KEY_RE.test(ck)) err(p, `目录名「${ck}」格式不正确`);
        if (!isObj(cat)) {
          err(p, '目录必须是对象');
          continue;
        }
        if (!str(cat.label) || !cat.label.trim()) err(p + '.label', '目录需要 label，例如"关卡"');
        if (!Array.isArray(cat.groups) || !cat.groups.length) {
          err(p + '.groups', 'groups 必须是非空数组（例如按章节分组）');
          continue;
        }
        const groupCodes = new Set();
        const itemCodes = new Set();
        cat.groups.forEach((g, gi) => {
          const gp = `${p}.groups[${gi}]`;
          if (!isObj(g)) return err(gp, '分组必须是对象');
          if (!str(g.code) || !ITEM_RE.test(g.code)) err(gp + '.code', '分组 code 必填，字母数字');
          else if (groupCodes.has(g.code)) err(gp + '.code', `分组 code「${g.code}」重复`);
          groupCodes.add(g.code);
          if (!str(g.name) || !g.name.trim()) err(gp + '.name', '分组 name 必填');
          if (!Array.isArray(g.items) || !g.items.length) return err(gp + '.items', 'items 必须是非空数组');
          g.items.forEach((it, ii) => {
            const ip = `${gp}.items[${ii}]`;
            if (!isObj(it)) return err(ip, '条目必须是对象');
            if (!str(it.code) || !ITEM_RE.test(it.code)) err(ip + '.code', '条目 code 必填，字母、数字、- _ .');
            else if (itemCodes.has(it.code)) err(ip + '.code', `条目 code「${it.code}」在目录内重复`);
            itemCodes.add(it.code);
            if (!str(it.name) || !it.name.trim()) err(ip + '.name', '条目 name 必填');
            if (isInt(it.cost)) {
              if (it.cost < 0) err(ip + '.cost', 'cost 不能为负');
            } else if (isObj(it.cost)) {
              if (!Object.keys(it.cost).length) err(ip + '.cost', 'cost 对象不能为空');
              for (const [mk, mv] of Object.entries(it.cost)) if (!isInt(mv) || mv < 0) err(`${ip}.cost.${mk}`, 'cost 必须是非负整数');
            } else err(ip + '.cost', 'cost 必须是整数，或按模式区分的对象，例如 {"clear": 8, "sweep": 3}');
            if (it.tags !== undefined && (!Array.isArray(it.tags) || it.tags.some((t) => !str(t)))) err(ip + '.tags', 'tags 必须是字符串数组');
            if (it.disabled !== undefined && typeof it.disabled !== 'boolean') err(ip + '.disabled', 'disabled 必须是布尔值');
          });
        });
      }
    }

    // fields
    if (!Array.isArray(def.fields) || !def.fields.length) {
      err('fields', 'fields 必须是非空数组');
      return { ok: !errors.length, errors, warnings };
    }
    if (def.fields.length > 30) err('fields', '最多 30 个字段');
    const seen = new Map();
    def.fields.forEach((f, i) => {
      const p = `fields[${i}]`;
      if (!isObj(f)) return err(p, '字段必须是对象');
      for (const k of Object.keys(f)) if (!FIELD_KEYS.has(k)) warn(`${p}.${k}`, `未知属性「${k}」会被忽略`);
      if (!str(f.key) || !KEY_RE.test(f.key)) err(p + '.key', 'key 必须是小写字母开头的字母、数字、下划线');
      else if (seen.has(f.key)) err(p + '.key', `key「${f.key}」重复`);
      if (!FIELD_TYPES.includes(f.type)) {
        err(p + '.type', `type 只能是 ${FIELD_TYPES.join(' / ')}`);
        seen.set(f.key, f);
        return;
      }
      if (!str(f.label) || !f.label.trim() || f.label.length > 30) err(p + '.label', 'label 必填，最多 30 个字');
      if (f.required !== undefined && typeof f.required !== 'boolean') err(p + '.required', 'required 必须是布尔值');

      if (OPTION_TYPES.has(f.type)) {
        if (!Array.isArray(f.options) || !f.options.length) err(p + '.options', '需要非空 options');
        else {
          const vals = new Set();
          f.options.forEach((o, oi) => {
            const op = `${p}.options[${oi}]`;
            if (!isObj(o)) return err(op, '选项必须是对象 {value, label}');
            if (!str(o.value) || !o.value.trim() || o.value.length > 32) err(op + '.value', 'value 必须是非空字符串');
            else if (vals.has(o.value)) err(op + '.value', `value「${o.value}」重复`);
            vals.add(o.value);
            if (!str(o.label) || !o.label.trim()) err(op + '.label', 'label 必填');
            if (o.points !== undefined && (!isInt(o.points) || o.points < 0)) err(op + '.points', 'points 必须是非负整数');
          });
          if (f.default !== undefined) {
            const defs = f.type === 'checkbox' ? f.default : [f.default];
            if (!Array.isArray(defs) || defs.some((d) => !vals.has(d))) err(p + '.default', 'default 必须是 options 里的 value');
          }
        }
        if (f.type === 'checkbox') {
          intRange(f, 'min_select', 0, 50, false, err, p + '.');
          intRange(f, 'max_select', 1, 50, false, err, p + '.');
        }
      }
      if (f.type === 'switch') {
        if (f.points !== undefined && (!isInt(f.points) || f.points < 0)) err(p + '.points', 'points 必须是非负整数');
        if (f.default !== undefined && typeof f.default !== 'boolean') err(p + '.default', 'default 必须是布尔值');
      }
      if (f.type === 'number') {
        if (!isInt(f.min) || !isInt(f.max)) err(p, 'number 需要整数 min 和 max');
        else if (f.min > f.max) err(p, 'min 不能大于 max');
        else if (f.default !== undefined && (!isInt(f.default) || f.default < f.min || f.default > f.max)) err(p + '.default', `default 必须在 ${f.min}–${f.max} 之间`);
        if (f.points_per !== undefined && (!isInt(f.points_per) || f.points_per < 0)) err(p + '.points_per', 'points_per 必须是非负整数');
        if (f.unit !== undefined && (!str(f.unit) || f.unit.length > 8)) err(p + '.unit', 'unit 最多 8 个字');
      }
      if (f.type === 'text') {
        intRange(f, 'maxlength', 1, 200, false, err, p + '.');
        if (f.pattern !== undefined) {
          try {
            new RegExp(f.pattern);
          } catch (e) {
            err(p + '.pattern', 'pattern 不是合法的正则表达式');
          }
        }
      }
      if (f.type === 'stage_picker') {
        const cat = isObj(catalogs) ? catalogs[f.catalog] : null;
        if (!str(f.catalog) || !cat) err(p + '.catalog', `catalog 必须指向 catalogs 里的目录${str(f.catalog) ? `（找不到「${f.catalog}」）` : ''}`);
        if (f.multiple !== undefined && typeof f.multiple !== 'boolean') err(p + '.multiple', 'multiple 必须是布尔值');
        if (f.multiple) intRange(f, 'max_select', 1, 200, false, err, p + '.');
        if (f.count !== undefined) {
          if (!isObj(f.count)) err(p + '.count', 'count 必须是对象 {label, min, max, default}');
          else {
            if (!isInt(f.count.min) || !isInt(f.count.max) || f.count.min < 1 || f.count.min > f.count.max || f.count.max > 999) err(p + '.count', 'count 需要整数 min ≥ 1、max ≤ 999，且 min ≤ max');
            if (f.count.default !== undefined && (!isInt(f.count.default) || f.count.default < f.count.min || f.count.default > f.count.max)) err(p + '.count.default', 'count.default 超出范围');
            if (f.count.visible_when !== undefined) checkVisibleWhen(f.count.visible_when, `${p}.count.visible_when`, seen, err);
          }
        }
        if (f.cost_by !== undefined) {
          const ref = seen.get(f.cost_by);
          if (!ref || !['radio', 'select'].includes(ref.type)) err(p + '.cost_by', 'cost_by 必须引用前面的 radio 或 select 字段');
          else if (cat && Array.isArray(cat.groups)) {
            const modes = new Set((ref.options || []).map((o) => o.value));
            cat.groups.forEach((g, gi) =>
              (g.items || []).forEach((it, ii) => {
                if (isObj(it.cost)) for (const mk of Object.keys(it.cost)) if (!modes.has(mk)) err(`catalogs.${f.catalog}.groups[${gi}].items[${ii}].cost.${mk}`, `「${mk}」不是 ${f.cost_by} 的选项`);
              })
            );
          }
        } else if (cat && Array.isArray(cat.groups) && cat.groups.some((g) => (g.items || []).some((it) => isObj(it.cost)))) {
          err(p + '.cost_by', '目录里有按模式区分的 cost，需要用 cost_by 指定模式字段');
        }
      }
      if (f.visible_when !== undefined) checkVisibleWhen(f.visible_when, p + '.visible_when', seen, err);
      seen.set(f.key, f);
    });

    return { ok: !errors.length, errors, warnings };
  }

  function checkVisibleWhen(vw, path, seen, err) {
    if (!isObj(vw) || !Object.keys(vw).length) return err(path, 'visible_when 必须是对象，例如 {"mode": "sweep"}');
    for (const [k, v] of Object.entries(vw)) {
      const ref = seen.get(k);
      if (!ref) {
        err(`${path}.${k}`, `只能引用排在前面的字段，找不到「${k}」`);
        continue;
      }
      const vals = Array.isArray(v) ? v : [v];
      if (OPTION_TYPES.has(ref.type) && ref.type !== 'checkbox') {
        const ok = new Set((ref.options || []).map((o) => o.value));
        for (const x of vals) if (!ok.has(x)) err(`${path}.${k}`, `「${x}」不是 ${k} 的选项`);
      } else if (ref.type === 'switch') {
        if (vals.some((x) => typeof x !== 'boolean')) err(`${path}.${k}`, 'switch 条件只能是 true 或 false');
      } else err(`${path}.${k}`, 'visible_when 只能引用 radio、select 或 switch 字段');
    }
  }

  function intRange(obj, key, min, max, required, err, prefix) {
    const v = obj[key];
    const path = (prefix || '') + key;
    if (v === undefined) {
      if (required) err(path, `${key} 必填`);
      return;
    }
    if (!isInt(v) || v < min || v > max) err(path, `${key} 必须是 ${min}–${max} 之间的整数`);
  }

  // 补全默认值后的定义，供编译和展示使用
  function normalize(def) {
    return {
      schema_version: SCHEMA_VERSION,
      code: def.code,
      name: def.name,
      description: def.description || '',
      capability: def.capability || def.code,
      timeout_minutes: def.timeout_minutes || 120,
      max_active_per_user: def.max_active_per_user || 3,
      refund_policy: def.refund_policy || 'prorate',
      member_discount: def.member_discount !== false,
      base_points: def.base_points || 0,
      catalogs: def.catalogs || {},
      fields: def.fields,
      limits: { max_units: (def.limits && def.limits.max_units) || 500 },
    };
  }

  // ====================================================================
  // 2. 编译：用户填写的参数 → 规范化参数 + 执行步骤 + 积分
  // ====================================================================
  function matchWhen(vw, values) {
    if (!vw) return true;
    return Object.entries(vw).every(([k, v]) => (Array.isArray(v) ? v : [v]).includes(values[k]));
  }
  // 会员折扣只在合计上计算一次（向下取整），避免小额单价逐项取整导致折扣失真。
  // 每个条目先按原价累计，结算部分完成时同样先按原价累计再打折，保证单调且完成时等于总价。
  function applyRate(raw, rate) {
    if (!raw) return 0;
    if (!rate || rate >= 100) return raw;
    return Math.max(1, Math.floor((raw * rate) / 100));
  }
  const discounted = (points) => points;
  function itemIndex(cat) {
    const map = new Map();
    for (const g of cat.groups) for (const it of g.items) map.set(it.code, { ...it, group: g.code, groupName: g.name });
    return map;
  }
  // 条目在某模式下的单价；null 表示该模式不可用
  function itemCost(it, mode) {
    if (isInt(it.cost)) return it.cost;
    if (mode == null) return null;
    return Object.prototype.hasOwnProperty.call(it.cost, mode) ? it.cost[mode] : null;
  }

  /**
   * @param def      已通过校验的功能定义
   * @param raw      用户提交的参数（可以不完整）
   * @param opts     { discountRate: 100 }
   * @returns {
   *   ok, values, visible:{key:bool}, fieldErrors:{key:msg}, errors:[msg],
   *   steps:[{seq,label,count,unitPoints,ref}], fixed:[{label,points}],
   *   units, fixedPoints, total, breakdown:[{label,detail,points}]
   * }
   */
  function compile(def, raw, opts) {
    const d = normalize(def);
    const rate = d.member_discount ? (opts && opts.discountRate) || 100 : 100;
    const input = isObj(raw) ? raw : {};
    const values = {};
    const visible = {};
    const fieldErrors = {};
    const fixed = [];
    const steps = [];
    const breakdown = [];
    const fe = (k, m) => {
      if (!fieldErrors[k]) fieldErrors[k] = m;
    };

    if (d.base_points) {
      const pts = discounted(d.base_points, rate);
      fixed.push({ label: '基础服务', points: pts });
      breakdown.push({ label: '基础服务', detail: '每个任务一次', points: pts });
    }

    for (const f of d.fields) {
      const vis = matchWhen(f.visible_when, values);
      visible[f.key] = vis;
      if (!vis) continue; // 隐藏字段不取值、不计价、不校验
      let v = input[f.key];
      switch (f.type) {
        case 'radio':
        case 'select': {
          if (v === undefined || v === '' || v === null) v = f.default;
          if (v === undefined) {
            if (f.required) fe(f.key, `请选择${f.label}`);
            break;
          }
          const opt = f.options.find((o) => o.value === v);
          if (!opt) {
            fe(f.key, `${f.label}选项不合法`);
            break;
          }
          values[f.key] = v;
          if (opt.points) {
            const pts = discounted(opt.points, rate);
            fixed.push({ label: `${f.label}：${opt.label}`, points: pts });
            breakdown.push({ label: `${f.label}：${opt.label}`, detail: '附加', points: pts });
          }
          break;
        }
        case 'checkbox': {
          if (v === undefined) v = f.default || [];
          if (!Array.isArray(v)) v = [v];
          const okVals = f.options.map((o) => o.value);
          const picked = okVals.filter((x) => v.includes(x)); // 去重并按选项顺序
          if (v.some((x) => !okVals.includes(x))) fe(f.key, `${f.label}含有不合法的选项`);
          if (f.required && !picked.length) fe(f.key, `请至少选择一项${f.label}`);
          if (f.min_select && picked.length < f.min_select) fe(f.key, `${f.label}至少选 ${f.min_select} 项`);
          if (f.max_select && picked.length > f.max_select) fe(f.key, `${f.label}最多选 ${f.max_select} 项`);
          values[f.key] = picked;
          for (const x of picked) {
            const opt = f.options.find((o) => o.value === x);
            if (opt.points) {
              const pts = discounted(opt.points, rate);
              fixed.push({ label: `${f.label}：${opt.label}`, points: pts });
              breakdown.push({ label: `${f.label}：${opt.label}`, detail: '附加', points: pts });
            }
          }
          break;
        }
        case 'switch': {
          if (v === undefined || v === '') v = f.default === true;
          v = v === true || v === 'true' || v === 1;
          values[f.key] = v;
          if (v && f.points) {
            const pts = discounted(f.points, rate);
            fixed.push({ label: f.label, points: pts });
            breakdown.push({ label: f.label, detail: '附加', points: pts });
          }
          break;
        }
        case 'number': {
          if (v === undefined || v === '' || v === null) v = f.default;
          if (v === undefined) {
            if (f.required) fe(f.key, `请填写${f.label}`);
            break;
          }
          const n = Number(v);
          if (!Number.isInteger(n)) {
            fe(f.key, `${f.label}必须是整数`);
            break;
          }
          if (n < f.min || n > f.max) {
            fe(f.key, `${f.label}需在 ${f.min}–${f.max}${f.unit || ''} 之间`);
            break;
          }
          values[f.key] = n;
          if (f.points_per !== undefined && n > 0) {
            const unitPts = discounted(f.points_per, rate);
            steps.push({ label: f.label, count: n, unitPoints: unitPts, unitLabel: f.unit || '', ref: { field: f.key } });
            breakdown.push({ label: f.label, detail: `${n}${f.unit || ''} × ${unitPts}`, points: unitPts * n });
          }
          break;
        }
        case 'text': {
          if (v === undefined || v === null) v = '';
          v = String(v).trim();
          if (f.required && !v) fe(f.key, `请填写${f.label}`);
          const max = f.maxlength || 100;
          if (v.length > max) fe(f.key, `${f.label}最多 ${max} 个字`);
          if (v && f.pattern && !new RegExp(f.pattern).test(v)) fe(f.key, `${f.label}格式不正确`);
          if (v) values[f.key] = v;
          break;
        }
        case 'stage_picker': {
          const cat = d.catalogs[f.catalog];
          const idx = itemIndex(cat);
          const mode = f.cost_by ? values[f.cost_by] : null;
          const countVisible = f.count && matchWhen(f.count.visible_when, values);
          if (v === undefined || v === null || v === '') v = [];
          if (!Array.isArray(v)) v = [v];
          const list = [];
          const dup = new Set();
          for (const entry of v) {
            const code = isObj(entry) ? entry.item : entry;
            if (!idx.has(code)) {
              fe(f.key, `${cat.label}「${code}」不存在`);
              continue;
            }
            if (dup.has(code)) continue;
            dup.add(code);
            const it = idx.get(code);
            if (it.disabled) {
              fe(f.key, `「${it.name}」暂不可选`);
              continue;
            }
            const cost = itemCost(it, mode);
            if (cost === null) {
              const modeLabel = f.cost_by ? (d.fields.find((x) => x.key === f.cost_by).options.find((o) => o.value === mode) || {}).label : '';
              fe(f.key, mode == null ? `请先选择${d.fields.find((x) => x.key === f.cost_by).label}` : `「${it.name}」不支持${modeLabel || mode}`);
              continue;
            }
            let count = 1;
            if (countVisible) {
              const c = isObj(entry) && entry.count !== undefined ? Number(entry.count) : f.count.default || f.count.min;
              if (!Number.isInteger(c) || c < f.count.min || c > f.count.max) {
                fe(f.key, `「${it.name}」${f.count.label || '次数'}需在 ${f.count.min}–${f.count.max} 之间`);
                continue;
              }
              count = c;
            }
            list.push({ item: code, count });
            const unitPts = discounted(cost, rate);
            steps.push({ label: it.name, count, unitPoints: unitPts, unitLabel: '次', ref: { field: f.key, item: code, group: it.group, mode } });
            breakdown.push({ label: it.name, detail: `${count} 次 × ${unitPts}`, points: unitPts * count });
          }
          if (!f.multiple && list.length > 1) fe(f.key, `${f.label}只能选一个`);
          if (f.multiple && f.max_select && list.length > f.max_select) fe(f.key, `${f.label}最多选 ${f.max_select} 个`);
          if (f.required && !list.length) fe(f.key, `请选择${f.label.replace(/^选择/, '')}`);
          values[f.key] = list;
          break;
        }
      }
    }

    // 没有按量计费的字段时，生成一个隐含步骤，代表"执行一次"
    if (!steps.length) steps.push({ label: d.name, count: 1, unitPoints: 0, unitLabel: '次', ref: { implicit: true } });
    steps.forEach((s, i) => (s.seq = i + 1));
    const units = steps.reduce((a, s) => a + s.count, 0);
    const fixedPoints = fixed.reduce((a, x) => a + x.points, 0);
    const unitTotal = steps.reduce((a, s) => a + s.unitPoints * s.count, 0);
    const rawTotal = fixedPoints + unitTotal;
    const total = applyRate(rawTotal, rate);
    if (rawTotal > total) breakdown.push({ label: '会员折扣', detail: `${rate / 10} 折`, points: total - rawTotal });
    const errors = Object.values(fieldErrors);
    if (units > d.limits.max_units) errors.push(`单个任务最多 ${d.limits.max_units} 个执行单位，当前 ${units}`);
    if (!errors.length && total <= 0) errors.push('合计积分为 0，请检查功能定价');
    return { ok: !errors.length, values, visible, fieldErrors, errors, steps, fixed, units, fixedPoints, rawTotal, total, breakdown, rate };
  }

  // 已完成 unitsDone 个执行单位时应扣的积分（按步骤顺序累加；只要开始执行就收取固定部分）
  function pointsForUnits(plan, unitsDone) {
    let left = Math.max(0, Math.min(unitsDone, plan.units));
    if (left === 0) return 0;
    if (left === plan.units) return plan.total;
    let raw = plan.fixedPoints;
    for (const s of plan.steps) {
      if (left <= 0) break;
      const take = Math.min(s.count, left);
      raw += take * s.unitPoints;
      left -= take;
    }
    return Math.min(plan.total, applyRate(raw, plan.rate));
  }
  // 每个步骤的完成情况，供进度展示
  function stepProgress(plan, unitsDone) {
    let left = Math.max(0, unitsDone);
    return plan.steps.map((s) => {
      const done = Math.min(s.count, left);
      left -= done;
      return { ...s, done };
    });
  }

  const api = { applyRate, SCHEMA_VERSION, FIELD_TYPES, REFUND_POLICIES, validateDefinition, normalize, compile, pointsForUnits, stepProgress, itemIndex, itemCost, matchWhen };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.FeatureSchema = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

 */
(function (root) {
  'use strict';

    INPUT_EXPIRED: ['INPUT_EXPIRED', 410, '输入已过期'],
    FORBIDDEN: ['FORBIDDEN', 403, '无权操作'],
    NOT_FOUND: ['NOT_FOUND', 404, '记录不存在'],
    UNAUTHORIZED: ['WORKER_UNAUTHORIZED', 401, 'Worker 认证失败'],
    WALLET_INSUFFICIENT: ['WALLET_INSUFFICIENT', 409, '钱包余额不足'],
    DUPLICATE: ['DUPLICATE', 409, '记录重复'],
    REFUND_BLOCKED: ['REFUND_BLOCKED', 409, '退款前置条件未满足'],
    VERSION_CONFLICT: ['VERSION_CONFLICT', 409, '数据已被其他人修改，请刷新后重试'],
  };
  function fail(key, message, detail) {

  }

  const BIND_STATUSES = ['PENDING', 'PROCESSING', 'WAIT_INPUT', 'WAIT_USER', 'SUCCESS', 'FAIL', 'CANCELLED'];
  const TASK_STATUSES = ['PENDING', 'PROCESSING', 'WAIT_INPUT', 'SUCCESS', 'FAIL', 'CANCELLED'];

  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const pad = (n, w) => String(n).padStart(w || 2, '0');
  function yuan(cents) {

    const v = Math.abs(cents);

  class Engine {
    constructor(state) {

    static emptyState() {

        seq: {},
        memberLevels: [],

        wallets: {},
        walletTxns: [],
        games: [],
        servers: [],
        features: [],

        orders: [],

        idempotency: {},
