      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Engine.restore(raw);
    } catch (e) {
      /* 预览环境可能禁用存储 */
    }
    return window.GameSeed.seed();
  };
  App.save = function () {
    try {
      localStorage.setItem(STORE_KEY, App.E.serialize());
    } catch (e) {
      /* 忽略 */
    }
  };
  App.E = App.load();

  App.ui = {
    role: 'buyer',
    buyerTab: 'boost',
    adminTab: 'games',
    userId: 2,
    adminId: 1,
    // 代练流程：选游戏 → 选账号 → 选功能 → 填表
    flow: { gameId: null, bindingId: null, featureId: null },
    bind: { gameId: 1, serverId: 1, login: '', password: '', displayName: '', open: false },
    inputs: {},
    lease: {},
    http: [],
    forms: {},
    openTask: null,
    admin: { gameId: null, featureId: null, draft: null, draftFor: null, previewUser: 2, taskStatus: '', grant: { userId: 1, amount: 100, validDays: 30, reason: '' }, newGame: { code: '', name: '', short: '', color: '#2f6f6a' }, newServer: { code: '', name: '', platform: 'all' }, pack: {} },
    modal: null,
    drawer: null,
    auto: false,
    checks: null,
    drill: null,
  };

  // ---------- 工具 ----------
  const esc = (App.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]));
  App.yuan = yuan;
  App.t = (ms) => App.E.fmtTime(ms);
  App.ago = function (ms) {
    const d = App.E.now - ms;
    if (d < MIN) return '刚刚';
    if (d < HOUR) return Math.floor(d / MIN) + ' 分钟前';
    if (d < DAY) return Math.floor(d / HOUR) + ' 小时前';
    return Math.floor(d / DAY) + ' 天前';
  };
  App.left = function (ms) {
    const d = ms - App.E.now;
    if (d <= 0) return '已到期';
    if (d < MIN) return Math.ceil(d / 1000) + ' 秒';
    if (d < HOUR) return Math.ceil(d / MIN) + ' 分钟';
    if (d < DAY) return Math.floor(d / HOUR) + ' 小时 ' + Math.floor((d % HOUR) / MIN) + ' 分';
    return Math.floor(d / DAY) + ' 天';
  };
  App.uid = () => Math.random().toString(36).slice(2, 10);

  const LABEL = {
    draft: ['草稿', ''], hidden: ['已隐藏', ''],
    pending_payment: ['待支付', 'warn'], fulfilling: ['交付中', 'run'], completed: ['已完成', 'ok'], canceled: ['已取消', ''], refunded: ['已退款', 'err'], partially_refunded: ['部分退款', 'err'],
    PENDING: ['排队中', 'info'], PROCESSING: ['执行中', 'run'], WAIT_INPUT: ['等待验证码', 'warn'], WAIT_USER: ['等待游戏内确认', 'warn'], SUCCESS: ['成功', 'ok'], FAIL: ['失败', 'err'], CANCELLED: ['已取消', ''],
    active: ['生效', 'ok'], paused: ['已暂停', ''], stopped: ['已停止', ''], stopped_insufficient_points: ['积分不足暂停', 'err'], exhausted: ['已用完', ''], expired: ['已过期', 'err'], revoked: ['已撤回', 'err'], disabled: ['已停用', 'err'],
  };
  App.label = (s) => (LABEL[s] ? LABEL[s][0] : s);
  App.pill = (s, text) => `<span class="pill ${LABEL[s] ? LABEL[s][1] : ''}">${esc(text || App.label(s))}</span>`;
  App.LEDGER_TYPE = { purchase: '购买到账', grant: '赠送/发放', hold: '任务冻结', release: '任务退回', consume: '任务消耗', expire: '到期失效', revoke: '撤回', admin_adjust: '人工扣减' };
  App.ERR_LABEL = Object.fromEntries(Object.entries(window.GameBoost.ERROR_CODES).map(([k, v]) => [k, v.label]));

  App.user = () => App.E.user(App.ui.userId);
  App.gameName = (id) => {
    const g = App.E.s.games.find((x) => x.id === id);
    return g ? g.name : '';
  };
  App.serverName = (id) => {
    const s = App.E.s.servers.find((x) => x.id === id);
    return s ? s.name : '';
  };
  App.getPath = function (obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  };
  App.setPath = function (obj, path, value) {
    const keys = path.split('.');
    let o = obj;
    for (let i = 0; i < keys.length - 1; i++) {
      if (o[keys[i]] == null || typeof o[keys[i]] !== 'object') o[keys[i]] = {};
      o = o[keys[i]];
    }
    o[keys[keys.length - 1]] = value;
  };
  App.bound = function (path) {
    const v = App.getPath(App.ui, path);
    return v == null ? '' : v;
  };
  // 渲染一个双向绑定的输入框
  App.input = function (path, attrs) {
    const a = attrs || {};
    return `<input data-bind="${path}" value="${esc(App.bound(path))}" ${a.type ? `type="${a.type}"` : ''} ${a.min != null ? `min="${a.min}"` : ''} ${a.max != null ? `max="${a.max}"` : ''} ${a.placeholder ? `placeholder="${esc(a.placeholder)}"` : ''} ${a.live ? `data-live="${a.live}"` : ''} ${a.rerender ? 'data-rerender="1"' : ''} ${a.cls ? `class="${a.cls}"` : ''} ${a.id ? `id="${a.id}"` : ''} aria-label="${esc(a.label || '')}" autocomplete="off">`;
  };
  App.select = function (path, options, attrs) {
    const a = attrs || {};
    const cur = String(App.bound(path));
    return `<select data-bind="${path}" ${a.num ? 'data-num="1"' : ''} data-rerender="1" ${a.cls ? `class="${a.cls}"` : ''} aria-label="${esc(a.label || '')}">${options
      .map(([v, t]) => `<option value="${esc(v)}" ${String(v) === cur ? 'selected' : ''}>${esc(t)}</option>`)
      .join('')}</select>`;
  };

  // ---------- 提示 ----------
  let toastTimer = null;
  App.toast = function (msg, kind) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3600);
  };

  // ---------- 渲染 ----------
  App.render = function () {
    const root = document.getElementById('app');
    const content = root.querySelector('.content');
    const scroll = content ? content.scrollTop : 0;
    const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.bind : null;
    const ui = App.ui;
    const E = App.E;
    let body = '';
    try {
      body = App.views[ui.role]();
    } catch (err) {
      console.error(err);
      body = `<div class="panel"><h3>渲染出错</h3><pre>${esc(err.stack || err.message)}</pre></div>`;
    }
    root.innerHTML = `
      <header class="top">
        <div class="brand"><b>独角数卡 · 自动代练</b><span>本地原型</span></div>
        <nav class="roles" aria-label="视角">
          ${[['buyer', '用户端'], ['admin', '管理后台'], ['worker', '执行端模拟']]
            .map(([k, t]) => `<button data-act="role" data-v="${k}" aria-pressed="${ui.role === k}">${t}</button>`)
            .join('')}
        </nav>
        <div class="clock">
          <label class="small" style="display:flex;gap:6px;align-items:center;color:#c9d5e0;cursor:pointer">
            <input type="checkbox" data-act="toggleAuto" ${ui.auto ? 'checked' : ''}> 执行端自动运行
          </label>
          <time title="引擎虚拟时间（北京时间）">${App.t(E.now)}</time>
          <div class="ff" role="group" aria-label="快进时间">
            ${[[MIN, '+1分'], [5 * MIN, '+5分'], [16 * MIN, '+16分'], [HOUR, '+1时'], [DAY, '+1天']]
              .map(([ms, t]) => `<button data-act="advance" data-ms="${ms}">${t}</button>`)
              .join('')}
            <button class="reset" data-act="reset" title="清空所有操作，恢复演示数据">重置</button>
          </div>
        </div>
      </header>
      <div class="shell">
        <main class="content">${body}</main>
        <aside class="log" aria-label="系统事件">
          <h3>系统事件 <span class="muted small">${E.s.jobs.length} 个排队作业</span></h3>
          <ol>${E.s.log
            .slice(-140)
            .reverse()
            .map((l) => `<li class="k-${l.kind}"><time>${App.t(l.at).slice(5)}</time>${esc(l.message)}</li>`)
            .join('')}</ol>
        </aside>
      </div>
      ${ui.drawer ? App.views.drawer() : ''}
      ${ui.modal ? `<div class="overlay" data-act="closeModalBg"><div class="modal ${ui.modal.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${App.views.modal()}</div></div>` : ''}
    `;
    // 顶栏在窄屏会换行，按实际高度设置内容区高度
    const top = root.querySelector('.top');
    if (top && top.offsetHeight && document.documentElement.style) document.documentElement.style.setProperty('--top-h', top.offsetHeight + 'px');
    const nc = root.querySelector('.content');
    if (nc) nc.scrollTop = scroll;
    if (focusId) {
      const f = root.querySelector(`[data-bind="${focusId}"]`);
      if (f) {
        f.focus();
        if (f.setSelectionRange && typeof f.value === 'string' && f.type !== 'number') f.setSelectionRange(f.value.length, f.value.length);
      }
    }
  };

  App.views.modal = function () {
    const m = App.ui.modal;
    const fn = App.views['modal_' + m.type];
    return fn ? fn(m) : '';
  };
  App.views.drawer = function () {
    const d = App.ui.drawer;
    return `<aside class="drawer" role="dialog" aria-label="详情"><button class="btn ghost close" data-act="closeDrawer" aria-label="关闭">关闭</button>${App.views['drawer_' + d.type](d)}</aside>`;
  };

  // ---------- 事件 ----------
  App.run = function (name, ds, el, evt) {
    const fn = App.actions[name];
    if (!fn) return;
    try {
      const res = fn(ds || {}, el, evt);
      if (res !== false) {
        App.save();
        App.render();
      }
    } catch (err) {
      if (!err.code) console.error(err);
      App.toast(err.message || String(err), 'err');
      App.save();
      App.render();
    }
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.type === 'checkbox' && el.dataset.act === 'toggleAuto') return; // 交给 change
    if (el.dataset.act === 'closeModalBg' && e.target !== el) return;
    e.preventDefault();
    App.run(el.dataset.act, el.dataset, el, e);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.act === 'toggleAuto') return App.run('toggleAuto', {}, el);
    if (!el.dataset.bind) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num && v !== '') v = Number(v);
    App.setPath(App.ui, el.dataset.bind, v);
    if (el.dataset.rerender || el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'number') App.render();
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT') return;
    App.setPath(App.ui, el.dataset.bind, el.value);
    if (el.dataset.live && App.live[el.dataset.live]) App.live[el.dataset.live]();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (App.ui.modal || App.ui.drawer)) {
      App.ui.modal ? (App.ui.modal = null) : (App.ui.drawer = null);
      App.render();
    }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
      e.preventDefault();
      App.setPath(App.ui, e.target.dataset.bind, e.target.value);
      App.run(e.target.dataset.enter, e.target.dataset, e.target);
    }
  });

  // ---------- 通用动作 ----------
  Object.assign(App.actions, {
    role(ds) {
      App.ui.role = ds.v;
      App.ui.drawer = null;
    },
    tab(ds) {
      App.ui[ds.group] = ds.v;
      App.ui.drawer = null;
      const c = document.querySelector('.content');
      if (c) c.scrollTop = 0;
    },
    advance(ds) {
      App.E.advance(Number(ds.ms));
    },
    reset() {
      if (!confirm('重置会清空所有订单、任务和流水，恢复初始演示数据。继续？')) return false;
      App.E = window.GameSeed.seed();
      App.ui.modal = null;
      App.ui.drawer = null;
      App.ui.http = [];
      App.ui.checks = null;
      App.ui.drill = null;
      App.ui.forms = {};
      App.ui.flow = { gameId: null, bindingId: null, featureId: null };
      App.ui.admin.draft = null;
      App.ui.admin.draftFor = null;
      App.toast('已恢复初始演示数据', 'ok');
    },
    closeModal() {
      App.ui.modal = null;
    },
    closeModalBg() {
      App.ui.modal = null;
    },
    closeDrawer() {
      App.ui.drawer = null;
    },
    toggleAuto(ds, el) {
      App.ui.auto = el.checked;
      App.toast(App.ui.auto ? '执行端会每秒自动领取并推进任务（每步时间前进 30 秒）' : '已停止自动执行');
    },
  });

  // ---------- Worker 调用记录 ----------
  App.callWorker = function (workerId, method, path, body, opts) {
    const r = App.E.workerCall(workerId, method, path, body, opts);
    App.ui.http.unshift({ at: App.E.now, workerId, ...r });
    App.ui.http = App.ui.http.slice(0, 30);
    return r.response;
  };

  // ---------- 执行端自动运行（模拟真实 Worker 的行为） ----------
  App.autoStep = function () {
    const E = App.E;
    const mem = App.ui.lease;
    for (const w of E.s.workers) {
      if (w.status !== 'active') continue;
      const res = App.callWorker(w.id, 'POST', '/api/v1/worker/pull', { kinds: ['bind', 'task'], max: 2 });
      for (const it of (res.body && res.body.items) || []) mem[it.lease_token] = { input: it.input, kind: it.kind };
    }
    for (const l of E.s.leases.filter((x) => x.active && x.expiresAt > E.now)) {
      const L = `/api/v1/worker/leases/${l.token}`;
      const m = mem[l.token] || {};
      if (l.kind === 'bind') {
        const b = E.binding(l.targetId);
        // 首次登录要求短信验证码，用户提交后第二次领取直接成功
        if (m.input || b.attempt > 1) App.callWorker(l.workerId, 'POST', L + '/finish', { request_id: 'auto-' + l.token, session_ref: 'sess-' + l.token.slice(-6) });
        else App.callWorker(l.workerId, 'POST', L + '/need-input', { kind: 'sms_code', prompt: '请输入发送到绑定手机的 6 位验证码' });
        continue;
      }
      const t = E.task(l.targetId);
      if (t.cancelRequested) {
        App.callWorker(l.workerId, 'POST', L + '/cancel-ack', { request_id: 'auto-c-' + l.token, units_done: t.unitsDone });
        continue;
      }
      // 每 30 秒完成 1 个执行单位；按分钟计费的功能每 30 秒完成 1 分钟（演示加速）
      const units = Math.min(t.units, t.unitsDone + 1);
      if (units >= t.units) {
        App.callWorker(l.workerId, 'POST', L + '/finish', { request_id: 'auto-f-' + l.token, units_done: t.units, result: App.fakeResult(t) });
      } else {
        const step = App.stepAt(t, units);
        App.callWorker(l.workerId, 'POST', L + '/events', { seq: t.eventSeq + 1, type: 'log', message: `${step.label} 第 ${step.n}/${step.count} ${step.unitLabel || '次'}完成` });
        App.callWorker(l.workerId, 'POST', L + '/heartbeat', { units_done: units, progress_text: `${step.label} ${step.n}/${step.count}` });
      }
    }
    E.advance(30 * 1000);
  };
  // 第 units 个执行单位落在哪个步骤
  App.stepAt = function (t, units) {
    let left = units;
    for (const st of t.plan.steps) {
      if (left <= st.count) return { label: st.label, n: left, count: st.count, unitLabel: st.unitLabel };
      left -= st.count;
    }
    const last = t.plan.steps[t.plan.steps.length - 1];
    return { label: last.label, n: last.count, count: last.count, unitLabel: last.unitLabel };
  };
  App.fakeResult = function (t) {
    const drops = t.plan.steps.slice(0, 4).map((st) => `${st.label.replace(/（.*）/, '')} 奖励 ×${st.count * 3}`);
    return { rewards: drops.length ? drops : ['完成'] };
  };
  setInterval(() => {
    if (!App.ui.auto || App.ui.modal) return;
    try {
      App.autoStep();
      App.save();
      App.render();
    } catch (err) {
      console.error(err);
      App.ui.auto = false;
      App.toast('自动执行出错：' + err.message, 'err');
      App.render();
    }
  }, 1000);

  // 首屏
  document.addEventListener('DOMContentLoaded', () => App.render());
  if (document.readyState !== 'loading') setTimeout(() => App.render(), 0);
})();

</script>
<script>/* ui-form.js */
/* 由功能 JSON 自动生成的代练表单。
 * 用户端"发起代练"和后台"实时预览"共用这一份渲染器，保证后台看到的就是用户看到的。
 *
 * 渲染器只依赖 compile() 的结果：可见性、默认值、错误、报价都由它算出，
 * 渲染器本身不做任何价格计算。
 */
(function () {
  'use strict';
  const App = window.App;
  const S = window.FeatureSchema;
  const { esc } = App;

  // 表单状态存在 App.ui.forms[formId] = { values, stageGroup, stageQuery }
  App.formState = function (formId) {
    const all = (App.ui.forms = App.ui.forms || {});
    if (!all[formId]) all[formId] = { values: {}, stageGroup: {}, stageQuery: {}, touched: {}, submitted: false };
    return all[formId];
  };
  App.resetForm = function (formId) {
    if (App.ui.forms) delete App.ui.forms[formId];
  };

  /**
   * @param formId  表单状态 key
   * @param def     功能定义
   * @param opts    { rate: 会员折扣率, interactive: true }
   * @returns { html, plan }
   */
  App.renderFeatureForm = function (formId, def, opts) {
    const st = App.formState(formId);
    const plan = S.compile(def, st.values, { discountRate: (opts && opts.rate) || 100 });
    const d = S.normalize(def);
    const html = d.fields
      .filter((f) => plan.visible[f.key])
      .map((f) => {
        // 字段错误只在用户动过这个字段、或点过提交之后才显示，避免一打开就满屏红字
        const err = st.submitted || st.touched[f.key] ? plan.fieldErrors[f.key] : null;
        const body = renderField(formId, d, f, plan, st);
        const tag = f.type === 'stage_picker' || f.type === 'checkbox' || f.type === 'radio' ? 'fieldset' : 'div';
        return `<${tag} class="ff ${err ? 'has-err' : ''}" data-ff="${esc(f.key)}">
          ${tag === 'fieldset' ? `<legend>${esc(f.label)}${f.required ? ' <i class="req">*</i>' : ''}</legend>` : `<label class="ff-label" for="ff-${formId}-${esc(f.key)}">${esc(f.label)}${f.required ? ' <i class="req">*</i>' : ''}</label>`}
          ${body}
          ${f.help ? `<p class="ff-help">${esc(f.help)}</p>` : ''}
          ${err ? `<p class="ff-err" role="alert">${esc(err)}</p>` : ''}
        </${tag}>`;
      })
      .join('');
    plan.showErrors = st.submitted || Object.keys(st.touched).length > 0;
    return { html, plan };
  };

  const pts = (n) => `<span class="pts-inline">${n} 点</span>`;
  function optPrice(o) {
    return o.points ? ` <span class="addon">+${o.points} 点</span>` : '';
  }

  function renderField(formId, d, f, plan, st) {
    const name = `${formId}:${f.key}`;
    const id = `ff-${formId}-${f.key}`;
    const v = plan.values[f.key];
    const data = `data-form="${esc(formId)}" data-key="${esc(f.key)}"`;
    switch (f.type) {
      case 'radio':
        return `<div class="seg-opts" role="radiogroup">${f.options
          .map((o) => `<label class="opt ${v === o.value ? 'on' : ''}"><input type="radio" name="${esc(name)}" value="${esc(o.value)}" ${v === o.value ? 'checked' : ''} ${data} data-ftype="radio">${esc(o.label)}${optPrice(o)}</label>`)
          .join('')}</div>`;
      case 'select':
        return `<select id="${id}" ${data} data-ftype="select"><option value="">请选择</option>${f.options
          .map((o) => `<option value="${esc(o.value)}" ${v === o.value ? 'selected' : ''}>${esc(o.label)}${o.points ? `（+${o.points} 点）` : ''}</option>`)
          .join('')}</select>`;
      case 'checkbox':
        return `<div class="chk-opts">${f.options
          .map((o) => `<label class="opt ${(v || []).includes(o.value) ? 'on' : ''}"><input type="checkbox" value="${esc(o.value)}" ${(v || []).includes(o.value) ? 'checked' : ''} ${data} data-ftype="checkbox">${esc(o.label)}${optPrice(o)}</label>`)
          .join('')}</div>`;
      case 'switch':
        return `<label class="switch"><input type="checkbox" id="${id}" role="switch" ${v ? 'checked' : ''} ${data} data-ftype="switch"><span class="track"></span><span>${v ? '开启' : '关闭'}${f.points ? ` <span class="addon">+${f.points} 点</span>` : ''}</span></label>`;
      case 'number': {
        const raw = st.values[f.key];
        const shown = raw !== undefined ? raw : v !== undefined ? v : '';
        return `<div class="num-row">
          <button type="button" class="btn sm" data-act="ffStep" data-form="${esc(formId)}" data-key="${esc(f.key)}" data-d="-${stepOf(f)}" aria-label="减少">−</button>
          <input id="${id}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" value="${esc(shown)}" ${data} data-ftype="number">
          <button type="button" class="btn sm" data-act="ffStep" data-form="${esc(formId)}" data-key="${esc(f.key)}" data-d="${stepOf(f)}" aria-label="增加">+</button>
          <span class="muted small">${esc(f.unit || '')}　${f.min}–${f.max}${f.points_per !== undefined ? `　每${esc(f.unit || '单位')} ${f.points_per} 点` : ''}</span>
        </div>`;
      }
      case 'text':
        return `<input id="${id}" type="text" maxlength="${f.maxlength || 100}" placeholder="${esc(f.placeholder || '')}" value="${esc(st.values[f.key] || '')}" ${data} data-ftype="text">`;
      case 'stage_picker':
        return renderStagePicker(formId, d, f, plan, st);
    }
    return '';
  }
  function stepOf(f) {
    const span = f.max - f.min;
    return span >= 200 ? 10 : span >= 50 ? 5 : 1;
  }

  // ---------- 关卡选择器 ----------
  function renderStagePicker(formId, d, f, plan, st) {
    const cat = d.catalogs[f.catalog];
    const mode = f.cost_by ? plan.values[f.cost_by] : null;
    const modeField = f.cost_by ? d.fields.find((x) => x.key === f.cost_by) : null;
    const modeLabel = modeField && mode ? (modeField.options.find((o) => o.value === mode) || {}).label : '';
    const countOn = f.count && S.matchWhen(f.count.visible_when, plan.values);
    const picked = new Map((plan.values[f.key] || []).map((x) => [x.item, x.count]));
    // 用户的原始选择（包括不合法的）也要保留勾选状态，方便取消
    const rawPicked = new Set((st.values[f.key] || []).map((x) => (typeof x === 'object' ? x.item : x)));
    const q = (st.stageQuery[f.key] || '').trim();
    const groupSel = st.stageGroup[f.key] || cat.groups[0].code;
    const groups = q ? cat.groups : cat.groups.filter((g) => g.code === groupSel);
    const data = `data-form="${esc(formId)}" data-key="${esc(f.key)}"`;
    const pickedCount = rawPicked.size;
    return `<div class="stage-picker">
      <div class="sp-head">
        <div class="sp-tabs" role="tablist">${cat.groups
          .map((g) => {
            const n = g.items.filter((it) => rawPicked.has(it.code)).length;
            return `<button type="button" role="tab" aria-selected="${!q && g.code === groupSel}" data-act="ffGroup" ${data} data-g="${esc(g.code)}">${esc(g.name)}${n ? ` <b>${n}</b>` : ''}</button>`;
          })
          .join('')}</div>
        <input type="search" class="sp-search" placeholder="搜索${esc(cat.label)}" value="${esc(q)}" data-form="${esc(formId)}" data-key="${esc(f.key)}" data-ftype="stage_search" aria-label="搜索${esc(cat.label)}">
      </div>
      ${f.cost_by && !mode ? `<p class="ff-help">先选择「${esc(modeField.label)}」，才能看到每个${esc(cat.label)}的价格。</p>` : ''}
      ${groups
        .map(
          (g) => `${q ? `<h5 class="sp-group">${esc(g.name)}</h5>` : ''}
        <div class="sp-grid">${g.items
          .filter((it) => !q || (it.name + it.code + (it.tags || []).join('')).includes(q))
          .map((it) => {
            const cost = S.itemCost(it, mode);
            const unsupported = cost === null && (mode != null || !f.cost_by);
            const off = it.disabled || unsupported;
            const on = rawPicked.has(it.code);
            const cnt = picked.get(it.code);
            const reason = it.disabled ? '暂不开放' : unsupported ? `不支持${esc(modeLabel)}` : '';
            return `<div class="sp-item ${on ? 'on' : ''} ${off ? 'off' : ''}">
              <label class="sp-main">
                <input type="${f.multiple ? 'checkbox' : 'radio'}" name="${esc(formId + ':' + f.key)}" value="${esc(it.code)}" ${on ? 'checked' : ''} ${off && !on ? 'disabled' : ''} ${data} data-ftype="stage">
                <span class="sp-name">${esc(it.name)}</span>
                <span class="sp-meta">${(it.tags || []).map((t) => `<span class="tag-s">${esc(t)}</span>`).join('')}</span>
                <span class="sp-cost">${reason ? `<span class="muted">${reason}</span>` : cost === null ? '' : `${cost} 点${countOn ? ' / 次' : ''}`}</span>
              </label>
              ${
                on && countOn && !off
                  ? `<div class="sp-count"><button type="button" class="btn sm" data-act="ffCount" ${data} data-item="${esc(it.code)}" data-d="-1" aria-label="减少次数">−</button>
                     <input type="number" min="${f.count.min}" max="${f.count.max}" value="${esc(cnt != null ? cnt : rawCount(st, f.key, it.code, f.count))}" ${data} data-item="${esc(it.code)}" data-ftype="stage_count" aria-label="${esc(it.name)} ${esc(f.count.label || '次数')}">
                     <button type="button" class="btn sm" data-act="ffCount" ${data} data-item="${esc(it.code)}" data-d="1" aria-label="增加次数">+</button>
                     <span class="muted small">${esc(f.count.label || '次数')}</span></div>`
                  : ''
              }
            </div>`;
          })
          .join('')}</div>`
        )
        .join('')}
      <div class="sp-foot"><span>已选 <b>${pickedCount}</b> 个${esc(cat.label)}${f.max_select ? `（最多 ${f.max_select}）` : ''}</span>${pickedCount ? `<button type="button" class="btn ghost sm" data-act="ffClear" ${data}>清空</button>` : ''}</div>
    </div>`;
  }
  function rawCount(st, key, code, count) {
    const e = (st.values[key] || []).find((x) => typeof x === 'object' && x.item === code);
    return e && e.count !== undefined ? e.count : count.default || count.min;
  }

  // ---------- 交互 ----------
  function stageList(st, key) {
    return (st.values[key] = (st.values[key] || []).map((x) => (typeof x === 'object' ? x : { item: x })));
  }
  function defOf(formId) {
    const fn = App.formDefs && App.formDefs[formId];
    return fn ? fn() : null;
  }
  function fieldOf(formId, key) {
    const d = defOf(formId);
    return d ? d.fields.find((x) => x.key === key) : null;
  }

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.form || !el.dataset.ftype) return;
    const st = App.formState(el.dataset.form);
    const key = el.dataset.key;
    const t = el.dataset.ftype;
    st.touched[key] = true;
    if (t === 'radio' || t === 'select') st.values[key] = el.value || undefined;
    else if (t === 'switch') st.values[key] = el.checked;
    else if (t === 'checkbox') {
      const cur = new Set(st.values[key] || (fieldOf(el.dataset.form, key) || {}).default || []);
      el.checked ? cur.add(el.value) : cur.delete(el.value);
      st.values[key] = [...cur];
    } else if (t === 'number') st.values[key] = el.value === '' ? undefined : Number(el.value);
    else if (t === 'text') st.values[key] = el.value;
    else if (t === 'stage') {
      const f = fieldOf(el.dataset.form, key);
      let list = stageList(st, key);
      if (f && !f.multiple) list = st.values[key] = el.checked ? [{ item: el.value }] : [];
      else if (el.checked) {
        if (!list.some((x) => x.item === el.value)) list.push({ item: el.value });
      } else st.values[key] = list.filter((x) => x.item !== el.value);
    } else if (t === 'stage_count') {
      const it = stageList(st, key).find((x) => x.item === el.dataset.item);
      if (it) it.count = el.value === '' ? undefined : Number(el.value);
    } else return;
    App.render();
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || el.dataset.ftype !== 'stage_search') return;
    App.formState(el.dataset.form).stageQuery[el.dataset.key] = el.value;
    clearTimeout(App._spT);
    App._spT = setTimeout(() => App.render(), 180);
  });

  Object.assign(App.actions, {
    ffGroup(ds) {
      const st = App.formState(ds.form);
      st.stageGroup[ds.key] = ds.g;
      st.stageQuery[ds.key] = '';
    },
    ffClear(ds) {
      App.formState(ds.form).values[ds.key] = [];
      App.formState(ds.form).touched[ds.key] = true;
    },
    ffCount(ds) {
      const st = App.formState(ds.form);
      App.formState(ds.form).touched[ds.key] = true;
      const f = fieldOf(ds.form, ds.key);
      const it = stageList(st, ds.key).find((x) => x.item === ds.item);
      if (!it || !f || !f.count) return false;
      const cur = it.count != null ? it.count : f.count.default || f.count.min;
      it.count = Math.max(f.count.min, Math.min(f.count.max, cur + Number(ds.d)));
    },
    ffStep(ds) {
      const st = App.formState(ds.form);
      App.formState(ds.form).touched[ds.key] = true;
      const f = fieldOf(ds.form, ds.key);
      if (!f) return false;
      const cur = st.values[ds.key] != null ? Number(st.values[ds.key]) : f.default != null ? f.default : f.min;
      st.values[ds.key] = Math.max(f.min, Math.min(f.max, cur + Number(ds.d)));
    },
  });

  // ---------- 报价单 ----------
  App.renderQuote = function (plan, available, opts) {
    const o = opts || {};
    const short = available != null && plan.total > available;
    const lines = plan.breakdown.slice(0, 12);
    return `<div class="quote-box ${!plan.ok ? 'bad' : short ? 'short' : ''}">
      <div class="qb-lines">${
        lines.length
          ? lines.map((l) => `<div><span>${esc(l.label)}</span><span class="muted">${esc(l.detail)}</span><b>${l.points > 0 ? '' : ''}${l.points}</b></div>`).join('') + (plan.breakdown.length > 12 ? `<div class="muted small">… 还有 ${plan.breakdown.length - 12} 项</div>` : '')
          : `<div class="muted">${plan.showErrors ? '还没有可计价的内容' : '选好内容后显示明细'}</div>`
      }</div>
      <div class="qb-total"><span>合计 <small class="muted">${plan.units} 个执行单位${plan.rate < 100 ? ` · 已按会员 ${plan.rate / 10} 折` : ''}</small></span><b class="pts">${plan.total}</b></div>
      ${!plan.ok && plan.errors.length && plan.showErrors && o.showErrors !== false ? `<p class="ff-err">${esc(plan.errors[0])}</p>` : ''}
      ${available != null ? `<div class="qb-avail ${short ? 'bad' : ''}">可用积分 ${available}${short ? `，还差 ${plan.total - available}` : ''}</div>` : ''}
    </div>`;
  };
  App.refundPolicyText = {
    full_on_system_fail: '系统原因失败（网络、维护、执行端故障、登录失败）全额退回；其它情况按已完成部分扣点。',
    prorate: '失败或取消时，只扣已完成部分的积分，其余退回。',
    none: '开始执行后不退积分。',
  };
})();

</script>
<script>/* ui-buyer.js */
/* 用户端：代练中心（选游戏 → 选账号 → 选功能 → 自动生成的表单）、我的任务、我的游戏账号、积分 */
(function () {
  'use strict';
  const App = window.App;
  const { esc, yuan } = App;
  const { TERMINAL } = window.GameEngine;
  const S = window.FeatureSchema;

  App.formDefs = App.formDefs || {};

  App.views.buyer = function () {
    const ui = App.ui;
    const E = App.E;
    const u = App.user();
    const pa = E.pointAccount(u.id);
    const level = E.level(u.levelId);
    const live = E.s.tasks.filter((t) => t.userId === u.id && !TERMINAL.has(t.status)).length;
    const waiting = E.s.bindings.filter((b) => b.userId === u.id && ['WAIT_INPUT', 'WAIT_USER'].includes(b.status) && !b.deletedAt).length + E.s.tasks.filter((t) => t.userId === u.id && t.status === 'WAIT_INPUT').length;
    const tabs = [
      ['boost', '发起代练'],
      ['tasks', '我的任务' + (live ? ` (${live})` : '')],
      ['accounts', '我的游戏账号'],
      ['points', '积分'],
    ];
    return `
      <div class="who">
        <label class="row small">当前用户 ${App.select('userId', E.s.users.map((x) => [x.id, x.name]), { num: true, label: '切换用户' })}</label>
        <span class="stat"><small>等级</small>${esc(level ? level.name : '')}${level && level.discountRate < 100 ? ` <span class="pill ok">${level.discountRate / 10} 折</span>` : ''}</span>
        <span class="stat"><small>积分</small><span class="pts">${pa.available.toLocaleString()}</span>${pa.frozen ? `<small>冻结 ${pa.frozen}</small>` : ''}</span>
        <span class="stat"><small>钱包</small><span class="money">${yuan(E.walletBalance(u.id))}</span></span>
        ${waiting ? `<button class="pill warn" data-act="tab" data-group="buyerTab" data-v="${E.s.tasks.some((t) => t.userId === u.id && t.status === 'WAIT_INPUT') ? 'tasks' : 'accounts'}">${waiting} 项等待你输入验证码</button>` : ''}
      </div>
      <nav class="subnav">${tabs.map(([k, t]) => `<button data-act="tab" data-group="buyerTab" data-v="${k}" aria-pressed="${ui.buyerTab === k}">${esc(t)}</button>`).join('')}</nav>
      ${App.views['buyer_' + ui.buyerTab]()}`;
  };

  // ===================== 发起代练 =====================
  App.views.buyer_boost = function () {
    const E = App.E;
    const uid = App.ui.userId;
    const fl = App.ui.flow;
    const games = E.publicGames();
    if (!games.length) return '<div class="empty">暂无上线的游戏。管理员需要在后台添加游戏、区服和代练功能并上线。</div>';
    if (!games.some((g) => g.id === fl.gameId)) Object.assign(fl, { gameId: games[0].id, bindingId: null, featureId: null });
    const game = E.game(fl.gameId);
    const bindings = E.s.bindings.filter((b) => b.userId === uid && b.gameId === game.id && !b.deletedAt);
    const ok = bindings.filter((b) => b.status === 'SUCCESS');
    if (!ok.some((b) => b.id === fl.bindingId)) fl.bindingId = ok[0] ? ok[0].id : null;
    const features = E.publicFeatures(game.id);
    if (!features.some((f) => f.id === fl.featureId)) fl.featureId = features[0] ? features[0].id : null;
    const feature = features.find((f) => f.id === fl.featureId);

    return `
      <div class="game-strip" role="tablist" aria-label="游戏">${games
        .map((g) => `<button role="tab" aria-selected="${g.id === game.id}" data-act="flowGame" data-id="${g.id}" style="--gc:${esc(g.color)}"><span class="gdot"></span>${esc(g.name)}<small>${E.publicFeatures(g.id).length} 个功能</small></button>`)
        .join('')}</div>

      <div class="boost-layout">
        <aside class="feature-list" aria-label="代练功能">
          <h3>代练功能</h3>
          ${features
            .map((f) => {
              const d = f.definition;
              return `<button class="feat ${f.id === fl.featureId ? 'on' : ''}" data-act="flowFeature" data-id="${f.id}" aria-pressed="${f.id === fl.featureId}">
                <b>${esc(d.name)}</b><span>${esc(App.priceHint(d))}</span>
              </button>`;
            })
            .join('') || '<p class="muted small">这个游戏还没有上架的代练功能。</p>'}
        </aside>

        <section class="panel boost-main">
          ${feature ? App.views.featureOrder(game, feature, ok, bindings) : ''}
        </section>
      </div>`;
  };

  // 功能列表上的一句话价格提示，例如"2–20 点 / 关" "20 点起"
  App.priceHint = function (d) {
    const n = S.normalize(d);
    const costs = [];
    for (const f of n.fields) {
      if (f.type === 'stage_picker') {
        for (const g of n.catalogs[f.catalog].groups) for (const it of g.items) for (const c of typeof it.cost === 'number' ? [it.cost] : Object.values(it.cost)) costs.push(c);
        const per = f.count ? '次' : n.catalogs[f.catalog].label.slice(-1);
        if (costs.length) return `${Math.min(...costs)}–${Math.max(...costs)} 点 / ${per}`;
      }
      if (f.type === 'number' && f.points_per !== undefined) return `${f.points_per} 点 / ${f.unit || '单位'}`;
    }
    return n.base_points ? `${n.base_points} 点起` : '按选项计费';
  };

  App.views.featureOrder = function (game, feature, okBindings, allBindings) {
    const E = App.E;
    const uid = App.ui.userId;
    const fl = App.ui.flow;
    const d = feature.definition;
    const formId = `user-${feature.id}`;
    App.formDefs[formId] = () => E.feature(feature.id).definition;
    const rate = d.member_discount ? E.discountRateOf(uid) : 100;
    const { html, plan } = App.renderFeatureForm(formId, d, { rate });
    const pa = E.pointAccount(uid);
    const pendingBind = allBindings.filter((b) => !['SUCCESS', 'FAIL', 'CANCELLED'].includes(b.status));
    const canSubmit = fl.bindingId && (!plan.ok || plan.total <= pa.available);
    return `
      <div class="fo-head">
        <div><h2>${esc(d.name)}</h2><p class="muted">${esc(d.description)}</p></div>
      </div>

      <div class="fo-account">
        <span class="ff-label">使用账号</span>
        ${
          okBindings.length
            ? `<div class="acct-chips">${okBindings
                .map((b) => `<button class="chip ${b.id === fl.bindingId ? 'on' : ''}" data-act="flowBinding" data-id="${b.id}" aria-pressed="${b.id === fl.bindingId}">${esc(b.displayName)} <small>${esc(App.serverName(b.serverId))} · ${esc(b.loginMasked)}</small></button>`)
                .join('')}<button class="chip add" data-act="openBind" data-game="${game.id}">＋ 添加账号</button></div>`
            : `<div class="need">${pendingBind.length ? `你的${esc(game.name)}账号正在验证中：${esc(pendingBind[0].userMessage || '')}。<button class="btn sm" data-act="tab" data-group="buyerTab" data-v="accounts">去查看</button>` : `还没有可用的${esc(game.name)}账号。代练需要登录你自己的游戏账号。<button class="btn primary sm" data-act="openBind" data-game="${game.id}">添加游戏账号</button>`}</div>`
        }
      </div>

      <div class="fo-grid">
        <div class="fo-form">${html}</div>
        <aside class="fo-side">
          ${App.renderQuote(plan, pa.available)}
          <button class="btn primary block" data-act="submitTask" data-feature="${feature.id}" ${canSubmit ? '' : 'disabled'}>${plan.ok ? `冻结 ${plan.total} 积分并开始` : '开始代练'}</button>
          ${plan.ok && plan.total > pa.available ? `<button class="btn amber block" data-act="tab" data-group="buyerTab" data-v="points">购买积分</button>` : ''}
          <p class="muted small">${esc(App.refundPolicyText[d.refund_policy])}</p>
          <p class="muted small">积分先冻结，执行端按步骤完成后结算；单个任务最长 ${d.timeout_minutes} 分钟。</p>
        </aside>
      </div>`;
  };

  App.views.modal_bind = function (m) {
    const E = App.E;
    const b = App.ui.bind;
    return `<h2>添加游戏账号</h2>
      <p class="muted small">代练需要登录你的游戏账号。密码加密保存，只在执行端登录时解密一次；可以随时解绑，解绑后立即销毁。</p>
      <div class="cols c2" style="gap:8px">
        <label class="field"><span>游戏</span>${App.select('bind.gameId', E.publicGames().map((g) => [g.id, g.name]), { num: true, label: '游戏' })}</label>
        <label class="field"><span>区服</span>${App.select('bind.serverId', E.s.servers.filter((s) => s.gameId === Number(b.gameId) && s.status === 'active').map((s) => [s.id, s.name]), { num: true, label: '区服' })}</label>
      </div>
      <label class="field"><span>备注名</span>${App.input('bind.displayName', { placeholder: '例如：大号', label: '备注名' })}</label>
      <label class="field"><span>登录名（手机号或邮箱）</span>${App.input('bind.login', { placeholder: '13800000000', label: '登录名' })}</label>
      <label class="field"><span>密码</span>${App.input('bind.password', { type: 'password', label: '密码' })}</label>
      <p class="muted small">提交后执行端会登录验证，可能需要你输入短信验证码。验证不收积分。</p>
      <div class="foot"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" data-act="createBinding">提交验证</button></div>`;
  };

  // ===================== 我的任务 =====================
  App.views.buyer_tasks = function () {
    const E = App.E;
    const tasks = E.s.tasks.filter((x) => x.userId === App.ui.userId).slice().reverse();
    if (!tasks.length) return '<div class="empty">还没有任务。到"发起代练"选一个功能开始。</div>';
    return `<section class="panel">${tasks.map((t) => App.views.taskRow(t)).join('')}</section>`;
  };

  App.views.taskRow = function (t) {
    const E = App.E;
    const b = E.s.bindings.find((x) => x.id === t.bindingId);
    const input = E.s.inputs.find((i) => i.target === 'task' && i.targetId === t.id && i.status === 'waiting');
    const open = App.ui.openTask === t.id;
    const prog = S.stepProgress(t.plan, t.unitsDone);
    const pct = Math.round((t.unitsDone / t.units) * 100);
    return `<article class="task ${t.status}">
      <div class="row between"><span><b>${esc(t.snapshot.name)}</b> <span class="muted small">${esc(App.gameName(t.gameId))} · ${esc(b ? b.displayName : '')} · ${esc(t.taskNo)}</span></span>${App.pill(t.status)}</div>
      <div class="small">${esc(t.summary)}</div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="进度"><i style="width:${pct}%"></i></div>
      <div class="ledger">
        <span>完成 ${t.unitsDone}/${t.units}</span>
        <span>冻结 <b class="pts">${t.pointsHeld}</b></span>
        ${TERMINAL.has(t.status) ? `<span>消耗 <b class="pts">${t.pointsConsumed}</b></span><span>退回 <b class="pts" style="color:var(--jade)">${t.pointsReleased}</b></span>` : ''}
        <span class="muted">${esc(t.progressText || '')}${t.errorCode ? ` · ${esc(App.ERR_LABEL[t.errorCode] || t.errorCode)}` : ''}</span>
      </div>
      ${
        input
          ? `<div class="need"><span class="small">${esc(input.prompt || '请输入验证码')}（${App.left(input.expiresAt)} 后过期）</span>
             <div class="row">${App.input(`inputs.t${t.id}`, { placeholder: '验证码', cls: 'inline', label: '验证码' })}<button class="btn primary sm" data-act="submitInput" data-target="task" data-id="${t.id}">提交</button></div></div>`
          : ''
      }
      ${t.result && t.result.rewards ? `<span class="small">获得：${t.result.rewards.map(esc).join('、')}</span>` : ''}
      <div class="row between">
        <button class="btn ghost sm" data-act="toggleTask" data-id="${t.id}" aria-expanded="${open}">${open ? '收起' : '步骤与日志'}</button>
        ${!TERMINAL.has(t.status) ? `<button class="btn sm danger" data-act="cancelTask" data-no="${t.taskNo}" ${t.cancelRequested ? 'disabled' : ''}>${t.cancelRequested ? '等待执行端确认取消' : '取消'}</button>` : ''}
      </div>
      ${
        open
          ? `<div class="cols c2" style="gap:12px">
              <table class="steps"><thead><tr><th>#</th><th>步骤</th><th class="num">完成</th><th class="num">单价</th></tr></thead><tbody>
              ${prog.map((s) => `<tr class="${s.done >= s.count ? 'done' : s.done ? 'doing' : ''}"><td>${s.seq}</td><td>${esc(s.label)}</td><td class="num">${s.done}/${s.count}</td><td class="num">${s.unitPoints}</td></tr>`).join('')}
              ${t.plan.fixed.map((x) => `<tr><td></td><td class="muted">${esc(x.label)}</td><td></td><td class="num">${x.points}</td></tr>`).join('')}
              </tbody></table>
              <div class="events">${E.s.taskEvents.filter((e) => e.taskId === t.id).slice(-40).map((e) => `<div><span class="muted">#${e.seq}</span><span class="muted">${App.t(e.at).slice(11)}</span><span>${esc(e.message)}</span></div>`).join('')}</div>
            </div>`
          : ''
      }
    </article>`;
  };

  // ===================== 我的游戏账号 =====================
  App.views.buyer_accounts = function () {
    const E = App.E;
    const bindings = E.s.bindings.filter((b) => b.userId === App.ui.userId && !b.deletedAt);
    return `<section class="panel">
      <div class="panel-head"><h3>我的游戏账号</h3><button class="btn primary sm" data-act="openBind" data-game="${(E.publicGames()[0] || {}).id || ''}">添加游戏账号</button></div>
      ${bindings.map((b) => App.views.bindingCard(b)).join('') || '<p class="muted">还没有绑定游戏账号。</p>'}
    </section>`;
  };

  App.views.bindingCard = function (b) {
    const E = App.E;
    const input = E.s.inputs.find((i) => i.target === 'binding' && i.targetId === b.id && i.status === 'waiting');
    return `<div class="binding">
      <div class="row between"><b>${esc(b.displayName)}</b>${App.pill(b.status)}</div>
      <span class="small muted">${esc(App.gameName(b.gameId))} · ${esc(App.serverName(b.serverId))} · ${esc(b.loginMasked)}</span>
      ${['WAIT_INPUT', 'WAIT_USER'].includes(b.status) ? '' : `<span class="msg">${esc(b.userMessage || '')}</span>`}
      ${
        b.status === 'WAIT_INPUT' && input
          ? `<div class="need"><span class="small">${esc(input.prompt || '请输入验证码')}（${App.left(input.expiresAt)} 后过期）</span>
             <div class="row">${App.input(`inputs.b${b.id}`, { placeholder: '6 位验证码', cls: 'inline', label: '验证码' })}<button class="btn primary sm" data-act="submitInput" data-target="binding" data-id="${b.id}">提交</button></div></div>`
          : ''
      }
      ${b.status === 'WAIT_USER' ? `<div class="need"><span class="small">${esc(b.userMessage)}</span><button class="btn primary sm" data-act="confirmInGame" data-id="${b.id}">我已在游戏内确认</button></div>` : ''}
      <div class="row end"><button class="btn ghost sm" data-act="deleteBinding" data-id="${b.id}">解绑</button></div>
    </div>`;
  };

  // ===================== 积分 =====================
  App.views.buyer_points = function () {
    const E = App.E;
    const uid = App.ui.userId;
    const sum = E.pointSummary(uid);
    const soon = sum.expiringSoon.reduce((a, l) => a + l.amount, 0);
    const ledger = E.s.pointLedger.filter((r) => r.userId === uid).slice().reverse();
    const lots = E.s.pointLots.filter((l) => l.userId === uid).slice().reverse();
    const orders = E.s.orders.filter((o) => o.userId === uid).slice().reverse();
    return `
      <div class="balance">
        <div><small>可用积分</small><b class="pts">${sum.available.toLocaleString()}</b></div>
        <div><small>冻结中（任务进行中）</small><b class="pts" style="color:var(--violet)">${sum.frozen.toLocaleString()}</b></div>
        <div><small>30 天内到期</small><b class="pts" style="color:${soon ? 'var(--red)' : 'var(--ink-3)'}">${soon.toLocaleString()}</b></div>
      </div>
      <section class="panel">
        <div class="panel-head"><h3>购买积分包</h3><span class="muted small">积分只能用于代练，不能提现，也不能转回钱包</span></div>
        <div class="packs">${E.s.pointPacks
          .filter((p) => p.active)
          .map((p) => {
            const q = E.quotePack(uid, p.id);
            return `<div class="pack">
              <span class="big">${q.points.toLocaleString()} 点</span>
              <span class="bonus">${p.bonus ? `含赠送 ${p.bonus} 点` : ''}</span>
              <span class="row between"><span class="money">${yuan(q.total)}</span>${q.memberDiscount ? `<s class="muted small">${yuan(q.original)}</s>` : ''}</span>
              <span class="muted small">${p.validDays ? `有效期 ${p.validDays} 天` : '永久有效'}</span>
              <button class="btn amber" data-act="buyPoints" data-id="${p.id}">购买</button>
            </div>`;
          })
          .join('')}</div>
      </section>
      ${
        orders.some((o) => o.status === 'pending_payment')
          ? `<section class="panel"><h3>待支付</h3>${orders
              .filter((o) => o.status === 'pending_payment')
              .map((o) => `<div class="row between" style="padding:6px 0"><span><code>${esc(o.orderNo)}</code> ${esc(o.items[0].title)} · ${yuan(o.total - o.walletPaid)} · 剩余 ${App.left(o.expiresAt)}</span><span class="row"><button class="btn primary sm" data-act="openPay" data-no="${o.orderNo}">去支付</button><button class="btn sm" data-act="cancelOrder" data-no="${o.orderNo}">取消</button></span></div>`)
              .join('')}</section>`
          : ''
      }
      <div class="cols c2" style="margin-top:16px">
        <section class="panel">
          <h3>积分批次</h3>
          <p class="muted small" style="margin-top:-4px">消耗时先用最早到期的批次，任务退回的积分回到原批次。</p>
          <table><thead><tr><th>来源</th><th class="num">总量</th><th class="num">剩余</th><th>到期</th><th>状态</th></tr></thead><tbody>
          ${lots.map((l) => `<tr class="${l.status === 'active' ? '' : 'dim'}"><td>${{ order: '购买', grant: '发放', promo: '活动赠送' }[l.sourceType] || l.sourceType}</td><td class="num">${l.amount}</td><td class="num">${l.remaining}</td><td class="small">${l.expiresAt ? App.t(l.expiresAt).slice(0, 10) : '永久'}</td><td>${App.pill(l.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">暂无</td></tr>'}
          </tbody></table>
        </section>
        <section class="panel">
          <h3>积分流水</h3>
          <table><thead><tr><th>时间</th><th>类型</th><th class="num">可用</th><th class="num">冻结</th><th class="num">余额</th></tr></thead><tbody>
          ${ledger
            .slice(0, 40)
            .map(
              (r) => `<tr><td class="small muted">${App.t(r.at).slice(5)}</td><td>${App.LEDGER_TYPE[r.type] || r.type}${r.taskId ? ` <span class="muted small">${esc((E.s.tasks.find((t) => t.id === r.taskId) || {}).taskNo || '')}</span>` : ''}</td>
              <td class="num" style="color:${r.dAvailable > 0 ? 'var(--jade)' : r.dAvailable < 0 ? 'var(--red)' : 'var(--ink-3)'}">${r.dAvailable > 0 ? '+' : ''}${r.dAvailable || '·'}</td>
              <td class="num muted">${r.dFrozen > 0 ? '+' : ''}${r.dFrozen || '·'}</td><td class="num">${r.availableAfter}</td></tr>`
            )
            .join('') || '<tr><td colspan="5" class="muted">暂无</td></tr>'}
          </tbody></table>
        </section>
      </div>`;
  };

  App.views.modal_pay = function (m) {
    const E = App.E;
    const o = E.orderByNo(m.orderNo);
    const p = E.s.payments.find((x) => x.orderId === o.id && x.status === 'pending');
    return `<h2>模拟支付网关</h2>
      <p>订单 <code>${esc(o.orderNo)}</code>（${esc(o.items[0].title)}）需在线支付 <b class="money">${yuan(o.total - o.walletPaid)}</b>${o.walletPaid ? `，已用余额抵扣 ${yuan(o.walletPaid)}` : ''}。</p>
      <p class="muted small">真实环境这里跳转支付宝 / 微信 / USDT 网关，由独角数卡原生支付模块处理。按钮模拟网关回调，可以测试重复回调和少付。</p>
      ${p ? `<p class="small">支付单 <code>${esc(p.paymentNo)}</code> · 已收到回调 ${p.callbacks} 次</p>` : ''}
      <div class="foot" style="justify-content:space-between">
        <button class="btn" data-act="closeModal">关闭</button>
        <span class="row">
          <button class="btn sm" data-act="payCallback" data-no="${o.orderNo}" data-mode="under">少付 1 分</button>
          <button class="btn sm" data-act="payCallback" data-no="${o.orderNo}" data-mode="dup">回调 3 次</button>
          <button class="btn primary" data-act="payCallback" data-no="${o.orderNo}" data-mode="ok">支付成功</button>
        </span>
      </div>`;
  };

  // ===================== 动作 =====================
  Object.assign(App.actions, {
    flowGame(ds) {
      Object.assign(App.ui.flow, { gameId: Number(ds.id), bindingId: null, featureId: null });
    },
    flowFeature(ds) {
      App.ui.flow.featureId = Number(ds.id);
    },
    flowBinding(ds) {
      App.ui.flow.bindingId = Number(ds.id);
    },
    openBind(ds) {
      const gid = Number(ds.game) || (App.E.publicGames()[0] || {}).id;
      const sv = App.E.s.servers.find((s) => s.gameId === gid && s.status === 'active');
      Object.assign(App.ui.bind, { gameId: gid, serverId: sv ? sv.id : null, login: '', password: '', displayName: '' });
      App.ui.modal = { type: 'bind' };
    },
    createBinding() {
      const b = App.ui.bind;
      App.E.createBinding(App.ui.userId, { gameId: Number(b.gameId), serverId: Number(b.serverId), login: b.login, password: b.password, displayName: b.displayName, idempotencyKey: App.uid() });
      App.ui.modal = null;
      App.ui.buyerTab = 'accounts';
      App.toast(App.ui.auto ? '已提交，执行端正在登录验证' : '已提交。勾选顶部"执行端自动运行"，或到"执行端模拟"手动处理。');
    },
    deleteBinding(ds) {
      if (!confirm('解绑后凭据立即销毁。继续？')) return false;
      App.E.deleteBinding(App.ui.userId, Number(ds.id));
    },
    submitInput(ds) {
      const key = (ds.target === 'binding' ? 'b' : 't') + ds.id;
      App.E.submitInput(App.ui.userId, ds.target, Number(ds.id), App.ui.inputs[key]);
      App.ui.inputs[key] = '';
      App.toast('已提交，执行端下次领取时继续', 'ok');
    },
    confirmInGame(ds) {
      App.E.confirmInGame(App.ui.userId, Number(ds.id));
    },
    submitTask(ds) {
      const fid = Number(ds.feature);
      const formId = `user-${fid}`;
      const st = App.formState(formId);
      const def = App.E.feature(fid).definition;
      const plan = window.FeatureSchema.compile(def, st.values, { discountRate: def.member_discount ? App.E.discountRateOf(App.ui.userId) : 100 });
      if (!plan.ok) {
        st.submitted = true;
        App.toast(plan.errors[0], 'err');
        return;
      }
      const r = App.E.createTask(App.ui.userId, { bindingId: App.ui.flow.bindingId, featureId: fid, params: st.values, idempotencyKey: App.uid() });
      App.resetForm(formId);
      App.ui.buyerTab = 'tasks';
      App.ui.openTask = App.E.taskByNo(r.taskNo).id;
      App.toast(`任务 ${r.taskNo} 已创建，冻结 ${r.points} 积分`, 'ok');
    },
    cancelTask(ds) {
      const r = App.E.userCancelTask(App.ui.userId, ds.no);
      App.toast(r.cancelRequested ? '已请求取消，执行端确认后只扣已完成部分' : '已取消，积分全额退回');
    },
    toggleTask(ds) {
      App.ui.openTask = App.ui.openTask === Number(ds.id) ? null : Number(ds.id);
    },
    buyPoints(ds) {
      const r = App.E.createOrder(App.ui.userId, { packId: Number(ds.id), useBalance: true, idempotencyKey: App.uid() });
      if (r.status === 'pending_payment') {
        App.E.createPayment(r.orderNo);
        App.ui.modal = { type: 'pay', orderNo: r.orderNo };
      } else {
        App.E.runDueJobs();
        App.toast('余额支付成功，积分已到账', 'ok');
      }
    },
    openPay(ds) {
      App.E.createPayment(ds.no);
      App.ui.modal = { type: 'pay', orderNo: ds.no };
    },
    payCallback(ds) {
      const E = App.E;
      const p = E.createPayment(ds.no);
      if (ds.mode === 'under') E.paymentCallback(p.paymentNo, p.amount - 1);
      else for (let i = 0; i < (ds.mode === 'dup' ? 3 : 1); i++) E.paymentCallback(p.paymentNo, p.amount);
      E.runDueJobs();
      App.ui.modal = null;
      const o = E.orderByNo(ds.no);
      if (o.status === 'completed') App.toast('支付成功，积分已到账', 'ok');
      else if (o.exceptions.length) App.toast('支付回调异常，未到账，已提示管理员处理', 'err');
    },
    cancelOrder(ds) {
      App.E.cancelOrder(App.ui.userId, ds.no);
    },
  });
})();

</script>
<script>/* ui-admin-games.js */
/* 管理后台：游戏 / 区服 / 代练功能（JSON 编辑器 + 结构校验 + 用户端实时预览） */
(function () {
  'use strict';
  const App = window.App;
  const S = window.FeatureSchema;
  const { esc } = App;

  // 新功能的起始模板：几种常见形态，管理员选一个改
  App.FEATURE_TEMPLATES = {
    stages: {
      label: '关卡（通关 / 扫荡）',
      def: {
        schema_version: 1,
        code: 'new_stage',
        name: '新关卡功能',
        description: '选择关卡，通关或扫荡。',
        capability: 'new_stage',
        refund_policy: 'prorate',
        catalogs: {
          stages: {
            label: '关卡',
            groups: [
              { code: 'ch1', name: '第一章', items: [{ code: '1-1', name: '1-1', cost: { clear: 5, sweep: 2 } }, { code: '1-2', name: '1-2', cost: { clear: 5, sweep: 2 } }, { code: '1-3', name: '1-3（BOSS）', cost: { clear: 10, sweep: 4 }, tags: ['BOSS'] }] },
              { code: 'ch2', name: '第二章', items: [{ code: '2-1', name: '2-1', cost: { clear: 7, sweep: 3 } }, { code: '2-2', name: '2-2（剧情）', cost: { clear: 8 }, tags: ['不可扫荡'] }] },
            ],
          },
        },
        fields: [
          { key: 'mode', type: 'radio', label: '模式', required: true, default: 'sweep', options: [{ value: 'clear', label: '通关' }, { value: 'sweep', label: '扫荡' }] },
          { key: 'stages', type: 'stage_picker', label: '选择关卡', catalog: 'stages', multiple: true, required: true, cost_by: 'mode', count: { label: '扫荡次数', min: 1, max: 99, default: 10, visible_when: { mode: 'sweep' } } },
        ],
      },
    },
    fixed: {
      label: '固定价 + 附加项（日常）',
      def: {
        schema_version: 1,
        code: 'new_daily',
        name: '新日常功能',
        description: '每次固定价格，可附加项目。',
        capability: 'new_daily',
        refund_policy: 'full_on_system_fail',
        base_points: 20,
        fields: [{ key: 'extras', type: 'checkbox', label: '附加项目', options: [{ value: 'a', label: '附加 A', points: 5 }, { value: 'b', label: '附加 B', points: 3 }] }],
      },
    },
    duration: {
      label: '按时长计费（挂机）',
      def: {
        schema_version: 1,
        code: 'new_idle',
        name: '新挂机功能',
        description: '按运行分钟计费。',
        capability: 'new_idle',
        refund_policy: 'prorate',
        member_discount: false,
        fields: [
          { key: 'area', type: 'select', label: '区域', required: true, options: [{ value: 'a', label: '区域 A' }, { value: 'b', label: '区域 B' }] },
          { key: 'minutes', type: 'number', label: '运行时长', unit: '分钟', min: 30, max: 480, default: 60, points_per: 1 },
        ],
      },
    },
  };

  App.gamePill = (st) => App.pill(st === 'active' ? 'active' : st === 'hidden' ? 'disabled' : 'draft', { active: '已上线', hidden: '已隐藏', draft: '草稿' }[st] || st);

  // ===================== 游戏与功能 =====================
  App.views.admin_games = function () {
    const E = App.E;
    const a = App.ui.admin;
    const games = E.s.games.slice().sort((x, y) => x.sort - y.sort || x.id - y.id);
    if (!a.gameId && games.length) a.gameId = games[0].id;
    const g = games.find((x) => x.id === a.gameId);
    return `<div class="admin-games">
      <aside class="panel ag-list">
        <div class="panel-head"><h3>游戏</h3><button class="btn sm" data-act="newGame">新建</button></div>
        ${games
          .map((x) => `<button class="ag-item ${x.id === a.gameId ? 'on' : ''}" data-act="pickGame" data-id="${x.id}"><span class="gdot" style="background:${esc(x.color)}"></span><span><b>${esc(x.name)}</b><small>${esc(x.code)} · ${E.s.features.filter((f) => f.gameId === x.id).length} 个功能</small></span>${App.gamePill(x.status)}</button>`)
          .join('') || '<p class="muted small">还没有游戏</p>'}
      </aside>
      <div>${g ? App.views.gameDetail(g) : '<div class="empty">新建一个游戏开始。</div>'}</div>
    </div>`;
  };

  App.views.gameDetail = function (g) {
    const E = App.E;
    const a = App.ui.admin;
    const servers = E.s.servers.filter((s) => s.gameId === g.id);
    const features = E.s.features.filter((f) => f.gameId === g.id).sort((x, y) => x.sort - y.sort);
    if (a.featureId && !features.some((f) => f.id === a.featureId) && a.featureId !== 'new') a.featureId = null;
    const canLive = servers.some((s) => s.status === 'active') && features.some((f) => f.status === 'active');
    return `
      <section class="panel">
        <div class="panel-head">
          <h3>${esc(g.name)} <span class="muted small" style="font-family:var(--sans)">${esc(g.code)} · v${g.version}</span></h3>
          <span class="row">${App.gamePill(g.status)}
            ${g.status !== 'active' ? `<button class="btn primary sm" data-act="gameStatus" data-id="${g.id}" data-v="active" ${canLive ? '' : 'disabled title="需要至少一个启用的区服和一个已上架的功能"'}>上线</button>` : `<button class="btn sm" data-act="gameStatus" data-id="${g.id}" data-v="hidden">隐藏</button>`}
            <button class="btn sm" data-act="editGame" data-id="${g.id}">编辑</button></span>
        </div>
        ${!canLive && g.status !== 'active' ? '<p class="note">上线前需要：至少一个启用的区服，以及至少一个已上架的代练功能。</p>' : ''}
        <h4 class="sub">区服</h4>
        <table><thead><tr><th>名称</th><th>code</th><th>平台</th><th>状态</th><th></th></tr></thead><tbody>
          ${servers.map((s) => `<tr class="${s.status === 'active' ? '' : 'dim'}"><td>${esc(s.name)}</td><td><code>${esc(s.code)}</code></td><td class="small">${esc(s.platform)}</td><td>${App.pill(s.status === 'active' ? 'active' : 'disabled', s.status === 'active' ? '启用' : '停用')}</td><td><button class="btn sm" data-act="serverStatus" data-id="${s.id}" data-v="${s.status === 'active' ? 'disabled' : 'active'}">${s.status === 'active' ? '停用' : '启用'}</button></td></tr>`).join('')}
          <tr><td>${App.input('admin.newServer.name', { placeholder: '名称，如：国服 · 一区', cls: 'inline', label: '区服名称' })}</td><td>${App.input('admin.newServer.code', { placeholder: 'cn-1', cls: 'inline', label: '区服 code' })}</td>
            <td>${App.select('admin.newServer.platform', [['all', '全平台'], ['android', '安卓'], ['ios', 'iOS'], ['pc', 'PC']], { cls: 'inline', label: '平台' })}</td><td></td><td><button class="btn sm primary" data-act="addServer" data-id="${g.id}">添加</button></td></tr>
        </tbody></table>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>代练功能</h3>
          <span class="row">新建：${Object.entries(App.FEATURE_TEMPLATES).map(([k, t]) => `<button class="btn sm" data-act="newFeature" data-tpl="${k}">${esc(t.label)}</button>`).join('')}</span></div>
        <table><thead><tr><th></th><th>功能</th><th>价格</th><th>字段</th><th>版本</th><th>状态</th><th></th></tr></thead><tbody>
          ${features
            .map(
              (f, i) => `<tr class="${a.featureId === f.id ? 'sel' : ''}">
              <td class="nowrap"><button class="btn ghost sm" data-act="moveFeature" data-id="${f.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="上移">↑</button><button class="btn ghost sm" data-act="moveFeature" data-id="${f.id}" data-d="1" ${i === features.length - 1 ? 'disabled' : ''} aria-label="下移">↓</button></td>
              <td><b>${esc(f.definition.name)}</b><br><code class="small">${esc(f.code)}</code></td>
              <td class="small">${esc(App.priceHint(f.definition))}</td>
              <td class="small muted">${f.definition.fields.map((x) => x.type === 'stage_picker' ? `${esc(f.definition.catalogs[x.catalog].label)}×${f.definition.catalogs[x.catalog].groups.reduce((n, gg) => n + gg.items.length, 0)}` : esc(x.label)).join('、')}</td>
              <td>v${f.version}</td>
              <td>${App.pill(f.status === 'disabled' ? 'disabled' : f.status, f.status === 'active' ? '已上架' : f.status === 'disabled' ? '已下架' : '草稿')}</td>
              <td class="row"><button class="btn sm primary" data-act="editFeature" data-id="${f.id}">编辑</button>
                ${f.status === 'active' ? `<button class="btn sm" data-act="featureStatus" data-id="${f.id}" data-v="disabled">下架</button>` : `<button class="btn sm" data-act="featureStatus" data-id="${f.id}" data-v="active">上架</button>`}</td></tr>`
            )
            .join('') || '<tr><td colspan="7" class="muted">还没有代练功能。从上面选一个模板新建。</td></tr>'}
        </tbody></table>
      </section>

      ${a.featureId ? App.views.featureEditor(g) : ''}`;
  };

  // ---------- 功能编辑器 ----------
  App.views.featureEditor = function (g) {
    const E = App.E;
    const a = App.ui.admin;
    const isNew = a.featureId === 'new';
    const f = isNew ? null : E.feature(a.featureId);
    const draftKey = isNew ? 'new' : f.id;
    if (a.draftFor !== draftKey) {
      a.draft = JSON.stringify(isNew ? App.FEATURE_TEMPLATES[a.tpl || 'stages'].def : App.cleanDef(f.definition), null, 2);
      a.draftFor = draftKey;
      App.resetForm('preview');
    }
    let def = null;
    let parseErr = '';
    try {
      def = JSON.parse(a.draft);
    } catch (e) {
      parseErr = e.message;
    }
    const v = def ? S.validateDefinition(def) : { ok: false, errors: [{ path: '', msg: 'JSON 格式错误：' + parseErr }], warnings: [] };
    const dirty = !isNew && def && v.ok && JSON.stringify(S.normalize(def)) !== JSON.stringify(f.definition);
    const versions = isNew ? [] : E.s.featureVersions.filter((x) => x.featureId === f.id).slice().reverse();
    const previewUser = E.user(Number(a.previewUser) || 2);
    let preview = '<p class="muted">修正左侧错误后显示预览。</p>';
    if (v.ok) {
      App.formDefs.preview = () => JSON.parse(App.ui.admin.draft);
      const rate = def.member_discount === false ? 100 : E.discountRateOf(previewUser.id);
      const r = App.renderFeatureForm('preview', def, { rate });
      App.formState('preview').submitted = true; // 预览里直接显示所有字段错误，便于检查文案
      preview = `<h2 style="font-size:19px">${esc(def.name)}</h2><p class="muted small">${esc(def.description || '')}</p>
        <div class="fo-form">${r.html}</div>${App.renderQuote(r.plan, null)}
        <details class="small" style="margin-top:8px"><summary>执行端会收到的步骤（${r.plan.steps.length}）</summary>
          <pre class="json-mini">${esc(JSON.stringify({ params: r.plan.values, steps: r.plan.steps.map((s) => ({ seq: s.seq, label: s.label, count: s.count, ref: s.ref })) }, null, 2))}</pre></details>`;
    }
    return `<section class="panel editor" id="feature-editor">
      <div class="panel-head">
        <h3>${isNew ? '新建代练功能' : `编辑「${esc(f.definition.name)}」 <span class="muted small" style="font-family:var(--sans)">当前 v${f.version}</span>`}</h3>
        <span class="row">
          <a class="btn ghost sm" href="#schema-help" data-act="toggleHelp">格式说明</a>
          <button class="btn sm" data-act="formatDraft" ${def ? '' : 'disabled'}>格式化</button>
          ${!isNew ? `<button class="btn sm" data-act="revertDraft" ${dirty ? '' : 'disabled'}>放弃修改</button>` : ''}
          <button class="btn sm" data-act="closeEditor">关闭</button>
          <button class="btn primary sm" data-act="saveFeature" data-game="${g.id}" ${v.ok && (isNew || dirty) ? '' : 'disabled'}>${isNew ? '保存为草稿' : '保存为新版本'}</button>
        </span>
      </div>
      ${App.ui.showHelp ? App.views.schemaHelp() : ''}
      <div class="editor-grid">
        <div>
          <textarea class="json" spellcheck="false" data-bind="admin.draft" data-live="draft" aria-label="功能定义 JSON">${esc(a.draft)}</textarea>
          <div class="v-result ${v.ok ? 'ok' : 'bad'}" id="v-result">${App.views.validation(v)}</div>
          ${!isNew ? `<p class="muted small">保存后生成新版本。已创建的任务保留下单时的版本和价格，不受影响。${dirty ? '<b> 有未保存的修改。</b>' : ''}</p>` : ''}
          ${versions.length > 1 ? `<details class="small"><summary>版本历史（${versions.length}）</summary><table>${versions.map((x) => `<tr><td>v${x.version}</td><td class="muted">${App.t(x.at)}</td><td class="muted">admin:${x.adminId}</td><td><button class="btn ghost sm" data-act="loadVersion" data-f="${f.id}" data-v="${x.version}">载入</button></td></tr>`).join('')}</table></details>` : ''}
        </div>
        <div class="preview">
          <div class="row between" style="margin-bottom:8px"><b class="small">用户端实时预览</b><label class="row small">按 ${App.select('admin.previewUser', E.s.users.map((u) => [u.id, u.name]), { cls: 'inline', label: '预览用户' })} 计价</label></div>
          <div class="preview-frame" id="preview-frame">${preview}</div>
        </div>
      </div>
    </section>`;
  };

  App.views.validation = function (v) {
    if (v.ok) return `✓ 结构正确${v.warnings.length ? `，${v.warnings.length} 条提示：` + v.warnings.map((w) => `<div class="small muted">${esc(w.path)}：${esc(w.msg)}</div>`).join('') : ''}`;
    return `✗ ${v.errors.length} 处错误` + v.errors.slice(0, 8).map((e) => `<div class="small"><code>${esc(e.path || '(根)')}</code> ${esc(e.msg)}</div>`).join('') + (v.errors.length > 8 ? `<div class="small">… 还有 ${v.errors.length - 8} 处</div>` : '');
  };

  // 编辑时只显示管理员写的内容，去掉 normalize 补出来的默认值，减少噪音
  App.cleanDef = function (d) {
    const out = JSON.parse(JSON.stringify(d));
    const defaults = { schema_version: 1, timeout_minutes: 120, max_active_per_user: 3, refund_policy: 'prorate', member_discount: true, base_points: 0 };
    for (const [k, v] of Object.entries(defaults)) if (out[k] === v && k !== 'schema_version') delete out[k];
    if (out.capability === out.code) delete out.capability;
    if (out.limits && out.limits.max_units === 500) delete out.limits;
    if (out.catalogs && !Object.keys(out.catalogs).length) delete out.catalogs;
    if (out.description === '') delete out.description;
    return out;
  };

  App.views.schemaHelp = function () {
    return `<div class="schema-help" id="schema-help">
      <div class="cols c2" style="gap:16px">
        <div>
          <b>顶层</b>
          <table class="small"><tbody>
            <tr><td><code>code</code></td><td>功能标识，创建后不可改，执行端按它路由</td></tr>
            <tr><td><code>name</code> / <code>description</code></td><td>用户看到的名称、说明</td></tr>
            <tr><td><code>capability</code></td><td>执行端能力名，默认等于 code</td></tr>
            <tr><td><code>base_points</code></td><td>每个任务固定收取（开始执行才收）</td></tr>
            <tr><td><code>refund_policy</code></td><td><code>prorate</code> 按完成量 / <code>full_on_system_fail</code> 系统失败全退 / <code>none</code></td></tr>
            <tr><td><code>member_discount</code></td><td>是否按会员等级打折，默认 true</td></tr>
            <tr><td><code>timeout_minutes</code> / <code>max_active_per_user</code></td><td>超时、每人并发</td></tr>
            <tr><td><code>catalogs</code></td><td>关卡 / 楼层 / 野怪等目录：<code>{label, groups:[{code,name,items:[{code,name,cost,tags,disabled}]}]}</code></td></tr>
          </tbody></table>
        </div>
        <div>
          <b>fields[].type</b>
          <table class="small"><tbody>
            <tr><td><code>radio</code> / <code>select</code></td><td>单选，<code>options[].points</code> 加价</td></tr>
            <tr><td><code>checkbox</code></td><td>多选附加项</td></tr>
            <tr><td><code>switch</code></td><td>开关，<code>points</code> 开启时加价</td></tr>
            <tr><td><code>number</code></td><td><code>min/max/unit</code>，<code>points_per</code> 按数量计费</td></tr>
            <tr><td><code>text</code></td><td><code>maxlength/pattern</code>，不计价</td></tr>
            <tr><td><code>stage_picker</code></td><td>从 <code>catalog</code> 选条目；<code>multiple</code>；<code>cost_by</code> 指定模式字段（cost 写成 <code>{"clear":5,"sweep":2}</code>）；<code>count</code> 每个条目可选次数</td></tr>
            <tr><td><code>visible_when</code></td><td>条件显示，例 <code>{"mode":"sweep"}</code>，只能引用前面的字段</td></tr>
          </tbody></table>
        </div>
      </div>
      <p class="small muted">完整说明见 docs/boost-feature-schema.md。价格单位都是积分（整数）。</p>
    </div>`;
  };

  // 编辑 JSON 时只局部刷新校验结果和预览，避免整页重绘打断输入
  App.live.draft = function () {
    clearTimeout(App._draftT);
    App._draftT = setTimeout(() => {
      const ta = document.querySelector('textarea.json');
      const pos = ta ? [ta.selectionStart, ta.selectionEnd, ta.scrollTop] : null;
      App.render();
      const nt = document.querySelector('textarea.json');
      if (nt && pos) {
        nt.focus();
        nt.setSelectionRange(pos[0], pos[1]);
        nt.scrollTop = pos[2];
      }
    }, 250);
  };

  Object.assign(App.actions, {
    pickGame(ds) {
      App.ui.admin.gameId = Number(ds.id);
      App.ui.admin.featureId = null;
      App.ui.admin.draftFor = null;
    },
    newGame() {
      App.ui.admin.newGame = { id: null, code: '', name: '', short: '', color: '#3a5f8f' };
      App.ui.modal = { type: 'game' };
    },
    editGame(ds) {
      const g = App.E.game(Number(ds.id));
      App.ui.admin.newGame = { id: g.id, code: g.code, name: g.name, short: g.short, color: g.color, version: g.version };
      App.ui.modal = { type: 'game' };
    },
    saveGame() {
      const n = App.ui.admin.newGame;
      const g = App.E.adminSaveGame(App.ui.adminId, n);
      App.ui.admin.gameId = g.id;
      App.ui.modal = null;
      App.toast(n.id ? '已保存' : `已新建「${g.name}」，接下来添加区服和代练功能`, 'ok');
    },
    gameStatus(ds) {
      App.E.adminSetGameStatus(App.ui.adminId, Number(ds.id), ds.v);
    },
    addServer(ds) {
      const n = App.ui.admin.newServer;
      App.E.adminSaveServer(App.ui.adminId, { gameId: Number(ds.id), ...n });
      App.ui.admin.newServer = { code: '', name: '', platform: 'all' };
    },
    serverStatus(ds) {
      App.E.adminSetServerStatus(App.ui.adminId, Number(ds.id), ds.v);
    },
    newFeature(ds) {
      const a = App.ui.admin;
      a.featureId = 'new';
      a.tpl = ds.tpl;
      a.draftFor = null;
      App.scrollToEditor();
    },
    editFeature(ds) {
      const a = App.ui.admin;
      a.featureId = Number(ds.id);
      a.draftFor = null;
      App.scrollToEditor();
    },
    closeEditor() {
      App.ui.admin.featureId = null;
      App.ui.admin.draftFor = null;
    },
    featureStatus(ds) {
      App.E.adminSetFeatureStatus(App.ui.adminId, Number(ds.id), ds.v);
    },
    moveFeature(ds) {
      App.E.adminReorderFeature(App.ui.adminId, Number(ds.id), Number(ds.d));
    },
    formatDraft() {
      const a = App.ui.admin;
      a.draft = JSON.stringify(JSON.parse(a.draft), null, 2);
    },
    revertDraft() {
      App.ui.admin.draftFor = null;
    },
    loadVersion(ds) {
      const v = App.E.s.featureVersions.find((x) => x.featureId === Number(ds.f) && x.version === Number(ds.v));
      App.ui.admin.draft = JSON.stringify(App.cleanDef(v.definition), null, 2);
      App.toast(`已载入 v${v.version}，保存后会成为新版本`);
    },
    toggleHelp() {
      App.ui.showHelp = !App.ui.showHelp;
    },
    saveFeature(ds) {
      const a = App.ui.admin;
      const isNew = a.featureId === 'new';
      const cur = isNew ? null : App.E.feature(a.featureId);
      const f = App.E.adminSaveFeature(App.ui.adminId, { id: isNew ? null : cur.id, gameId: Number(ds.game), definition: a.draft, version: isNew ? null : cur.version });
      a.featureId = f.id;
      a.draftFor = null;
      App.toast(isNew ? `已保存为草稿。确认预览无误后点"上架"。` : `已保存为 v${f.version}`, 'ok');
    },
  });
  App.scrollToEditor = function () {
    setTimeout(() => {
      const el = document.getElementById('feature-editor');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 30);
  };

  App.views.modal_game = function () {
    const n = App.ui.admin.newGame;
    return `<h2>${n.id ? '编辑游戏' : '新建游戏'}</h2>
      <label class="field"><span>名称</span>${App.input('admin.newGame.name', { placeholder: '例如：星落幻境', label: '名称' })}</label>
      <div class="cols c2" style="gap:8px">
        <label class="field"><span>code（小写字母、数字、下划线；创建后不可改）</span>${App.input('admin.newGame.code', { placeholder: 'starfall', label: 'code' }).replace('<input', n.id ? '<input disabled' : '<input')}</label>
        <label class="field"><span>简称</span>${App.input('admin.newGame.short', { placeholder: '星落', label: '简称' })}</label>
      </div>
      <label class="field"><span>主题色</span>${App.input('admin.newGame.color', { type: 'color', label: '主题色' })}</label>
      <p class="muted small">新游戏是草稿状态。添加区服和代练功能并上架后，才能上线给用户看到。</p>
      <div class="foot"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" data-act="saveGame">保存</button></div>`;
  };
})();

</script>
<script>/* ui-ops.js */
/* 执行端模拟 + 管理后台 */
(function () {
  'use strict';
  const App = window.App;
  const { esc, yuan } = App;
  const { TERMINAL, MIN, HOUR, DAY } = window.GameEngine;

  // ===================== 执行端模拟 =====================
  App.views.worker = function () {
    const E = App.E;
    const now = E.now;
    const leases = E.s.leases.filter((l) => l.active);
    const pendingTasks = E.s.tasks.filter((t) => t.status === 'PENDING').length;
    const pendingBinds = E.s.bindings.filter((b) => b.status === 'PENDING' && !b.deletedAt).length;
    return `
      <div class="note">这里扮演真实的游戏执行程序。每个按钮都会生成一个带 HMAC 签名的 HTTP 请求，交给服务端校验后处理，右侧能看到完整请求和响应。
        协议见设计文档 §7：领取（pull）→ 心跳 → 上报事件 → 完成 / 失败 / 需要输入 / 确认取消。</div>
      <div class="workers">${E.s.workers
        .map(
          (w) => `<div class="worker">
            <div class="row between"><b>${esc(w.name)}</b>${App.pill(w.status)}</div>
            <span class="caps">${w.capabilities.map((c) => `${esc(App.E.s.games.find((g) => g.code === c.game).short)}：${c.features.join(' / ')}`).join('<br>')}</span>
            <code>key ${esc(w.apiKey.slice(0, 14))}…</code>
            <span class="small muted">并发 ${w.maxConcurrency} · 领取 ${w.stats.pulled} · 成功 ${w.stats.success} · 失败 ${w.stats.fail} · 被拒 ${w.stats.rejected}${w.lastSeenAt ? ` · ${App.ago(w.lastSeenAt)}在线` : ''}</span>
            <div class="row">
              <button class="btn primary sm" data-act="wPull" data-id="${w.id}" ${w.status !== 'active' ? 'disabled' : ''}>领取</button>
              <button class="btn sm" data-act="wBadSign" data-id="${w.id}" title="用错误密钥签名">错签名</button>
              <button class="btn sm" data-act="wReplay" data-id="${w.id}" title="重放上一次请求">重放</button>
            </div>
          </div>`
        )
        .join('')}</div>
      <div class="cols c2" style="align-items:start">
        <section>
          <div class="panel-head"><h3>持有中的租约</h3><span class="muted small">排队：任务 ${pendingTasks} · 绑定 ${pendingBinds}</span></div>
          ${
            leases.length
              ? leases
                  .map((l) => {
                    const o = l.kind === 'task' ? E.task(l.targetId) : E.binding(l.targetId);
                    const w = E.worker(l.workerId);
                    const expired = l.expiresAt <= now;
                    const L = (App.ui.lease[l.token] = App.ui.lease[l.token] || {});
                    if (l.kind === 'task' && (L.units == null || L.units === '' || Number(L.units) < o.unitsDone)) L.units = o.unitsDone;
                    return `<div class="lease ${l.kind === 'task' && o.cancelRequested ? 'cancel' : ''}">
                      <div class="row between"><b>${l.kind === 'task' ? `任务 ${esc(o.taskNo)} · ${esc(o.snapshot.name)}` : `绑定 #${o.id} · ${esc(o.displayName)}`}</b>
                        <span class="pill ${expired ? 'err' : 'run'}">${expired ? '租约已过期' : '剩 ' + App.left(l.expiresAt)}</span></div>
                      <span class="small muted">${esc(w.name)} · 第 ${o.attempt} 次 · token <code>${esc(l.token.slice(0, 12))}…</code>${L.input ? ` · 收到用户输入 <span class="cred">${esc(L.input.value || '已确认')}</span>` : ''}</span>
                      ${l.kind === 'task' && o.cancelRequested ? '<span class="pill err">用户请求取消，请确认</span>' : ''}
                      ${
                        l.kind === 'task'
                          ? `<label class="row small">已完成 ${App.input(`lease.${l.token}.units`, { type: 'number', min: 0, max: o.units, cls: 'inline', label: '完成量' })} / ${o.units} 个执行单位</label><span class="small muted">${esc(o.summary)}</span>`
                          : ''
                      }
                      <div class="row">
                        <button class="btn sm" data-act="wHeartbeat" data-t="${l.token}">心跳</button>
                        ${l.kind === 'task' ? `<button class="btn sm" data-act="wEvent" data-t="${l.token}">上报日志</button>` : ''}
                        <button class="btn sm" data-act="wNeedInput" data-t="${l.token}" data-k="sms_code">要验证码</button>
                        ${l.kind === 'bind' ? `<button class="btn sm" data-act="wNeedInput" data-t="${l.token}" data-k="confirm">要游戏内确认</button>` : ''}
                        <button class="btn primary sm" data-act="wFinish" data-t="${l.token}">完成</button>
                        ${l.kind === 'task' && o.cancelRequested ? `<button class="btn danger sm" data-act="wCancelAck" data-t="${l.token}">确认取消</button>` : ''}
                      </div>
                      <div class="row small">失败：
                        ${['NETWORK', 'GAME_MAINTENANCE', 'PASSWORD_CHANGED', 'STAGE_LOCKED', 'INSUFFICIENT_STAMINA', 'USER_KICKED']
                          .map((c) => `<button class="btn sm" data-act="wFail" data-t="${l.token}" data-c="${c}" title="${c}">${esc(App.ERR_LABEL[c])}</button>`)
                          .join('')}
                      </div>
                    </div>`;
                  })

  App.redactHttp = function (body) {
    const s = JSON.stringify(body, (k, v) => (k === 'password' && typeof v === 'string' ? v.slice(0, 2) + '••••' : v));
    return s.length > 420 ? s.slice(0, 420) + '…' : s;
